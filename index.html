/* 【2026-11-07 ② 谢寻三场景 · 2.2 开场叙述】
   原文 2.2 是「二周目开场状态」的叙述，产品此前从未上屏：开局页 #intro 是
   一周目共用的课程介绍，结局页也不回开局页。这里在车厢页顶部给二周目
   加一块开场状态卡；批 B′ 后二周目的唯一入口是结局页「走第二趟」确认块，
   开局页永远新开一周目。一周目不进分支，页面输出逐字不变。
   文案只在 secondRun.opening.text；字段缺失 / 仍为占位时逐字回退 OPENING_OLD。
   OPENING_OLD 是原文 2.2 旧串，逐字保留、一字未改；一周目分支也逐字返回它
   （一周目开局页另有「大雾漫过铁轨…」，本批按「一周目所有行为不动」不碰）。 */
const OPENING_OLD='你睁开眼，手里攥着一本手账。有几页还在——广播站名、车窗上的字、老冯没说完的那句话——但最后那页你拼出来的答案，只剩一些模糊不清的文字。列车还在雾里。广播又在念那个时刻表上没有的站名。';
function openingText(){
  if(!isSecondRun()) return OPENING_OLD;
  const o=(STORY.secondRun||{}).opening||{};
  return pendingText(o.text, OPENING_OLD);
}
/* 【地点分区 v2 · 2026-11-08】车厢页拆成「三块共用 + 两条分支」：
   · sceneCommon()  开场状态卡 / 区间标题 / tip —— 开关不影响这三段，旧代码逐字搬出来
   · renderLoverCard(L) / bgButton(n) / eggButton(id) / zhuyanCard() / nextZoneBtn() 单块 UI，两条分支共用
   · sceneLegacy()  改动前的顺序（lovers → 祝颜 → 其 他 人 → 彩蛋 → 下一区间）。
                    locationSystem.enabled=false 时走它，输出与改动前逐字相同。
   · sceneByLocation() 地点标签栏 + 背景横幅 + 当前地点 NPC + 工作人员区。
   铁律：分叉只在「怎么排」；动作 / 数值 / 判定链 / 文案一行未动。 */

function sceneCommon(){
  /* 【2026-11-07 ②】开场状态卡只在二周目第 1 区间出现；不耗点、不写状态、不进判定链。 */
  let h = (isSecondRun() && S.zone===1)
    ? `<div class="card"><div class="ttl">开 场<small>第 ${S.runIndex} 趟</small></div><div class="desc">${esc(openingText())}</div></div>`
    : '';
  h += `<div class="sec">第 ${S.zone} 区间 · 车厢</div>`;
  if(S.srPool){
    /* 【文案整理 v1 · 1】二周目 tip 三段全在数据层：tipPool（总池口径）/ tipFast（这一趟怎么记）/
       tipKnowerSecondRun（知情人 + 回访）。任一为空串即跳过该段，不露占位、不留空行。 */
    const pool=apText('tipPool'), fast=apText('tipFast'), knower=apText('tipKnowerSecondRun');
    h += `<div class="tip">行动点 ${S.actionsLeft}/${actionTotal()}`
      + (pool ? '，'+esc(pool) : '') + '。'
      + (fast ? esc(fast) : '')
      + (knower ? '<br>'+esc(knower) : '') + `</div>`;
  } else {
    h += `<div class="tip">行动点 ${S.actionsLeft}/${actionTotal()}，${esc(apText('tipNeutral'))}。线索要去「主线」页看看有什么才记下（不耗点）；初见搭话、背景NPC 闲聊也不耗点；陪伴／深聊／问清楚／首次找人问话才花点。<br>车开到哪一节，能碰上的知情人不一样；回访补听不额外花点。</div>`;
  }
  return h;
}

/* 祝颜卡（主页面入口 · 最终版）：开关关闭 / 旧档无 conductorHomeCard 字段时
   renderConductorCard() 返回空串，这里回退到原来的「摆设」卡片。
   中撤回：删掉下面这两行、把 if(!zy) 那段删掉即可。 */
function zhuyanCard(){
  const zy=KEY_BY['conductor_f'];
  /* 【C1】zone1 的教学枚不走通道 A，「祝颜印证」按钮在 zone1 一律不出现 */
  const zSlot=clueOf(S.zone), zCan=zSlot.found&&zSlot.state==='raw'&&S.zone!==1;
  const chc=CFG.conductorHomeCard.enabled?renderConductorCard():'';
  if(chc) return chc;
  if(!zy) return '';
  return `<div class="card">
      <div class="ttl">${esc(zy.name)}<small>雾线引路 · trust ${S.trust}</small></div>
      <div class="desc">她只递半句提醒，不下指令；台词按 trust 实际档位取（M4）。</div>
      <button class="btn" data-act="zhuyan" ${zCan?'':'disabled'}><b>去问祝颜</b><small>${zCan?'花 1 点':'先在主线页看看有什么，且还没问过'}</small></button>
    </div>`;
}

/* 【地点分区 v2 · 2.5 知情人 AND】原逻辑是 knower && knowerHere()。
   现在多一道地点：知情人只在自己待的地点出现。
   ⚠️ 苏叶在「连接处·后」、陈桂兰在「硬座车厢」，两人不是同一地点；
      严格按地点 AND，陈桂兰按钮只在硬座渲染，可它是挂在苏叶卡里的 →
      会永久点不到。所以默认 knowerStrictLocation:false = 知情人跟着角色卡走
      （地点 AND 退化为「卡片在哪他在哪」，与改动前等价）；
      置 true 才是字面 AND（须先把两人挪到同一地点）。 */
function knowerAtLover(L){
  const kid=L.knower, N=kid?KEY_BY[kid]:null;
  if(!N || !knowerHere(kid)) return null;
  if(locOn() && CFG.locationSystem.knowerStrictLocation===true && (N.location||'')!==S.location) return null;
  return N;
}

/* 角色卡：原 scene() 里 activeLovers().forEach 的卡片体原样搬出来，逻辑/文案/按钮一字未改。 */
function renderLoverCard(L){
  const sr=srLover(L);                       // 【二周目扩面第一批】五位常规角色二周目均为 true
  const xie=sr && L.id==='xie_xun';          // 【批 1】谢寻：二周目唯一 meta 恋人，陪伴加好感、有专属旧照片事件
  const a=S.aff[L.id]||0, met=!!S.met[L.id], compDone=!!S.comp[L.id+':'+S.zone], deepDone=!!S.deep[L.id];
  const knowId=L.knower, knower=knowerAtLover(L);   // C：这一区间 / 这一地点他在不在
  const kGot=S.knowBonus[knowId]||0;           // A：已经从他那儿听到多少
  const kFull=kGot>=KNOW_MAX;
  // 深度按钮只认「公开条件」：初见 + 好感达标。隐藏前置一律不体现在界面上。
  // 【二周目第一批】deepEvent:false：二周目常规角色一律不列可点的深度事件。
  // 【批 1】谢寻的旧照片由 maybeTriggerXieXunPhoto 在 zone4+ 自动触发，深度按钮对其整条不渲染。
  const deepReady=!sr && met && a>=CFG.deepUnlock && !deepDone;
  const gauge = sr
    ? (xie ? `好感 ${a} ｜ 已陪伴 ${S.compTimes[L.id]||0} 次`
           : `二周目 · 已陪伴 ${S.compTimes[L.id]||0} 次 · 陪伴不加好感`)
    : `好感 ${a} ｜ 已陪伴 ${S.compTimes[L.id]||0} 次`;
  const compSub = sr
    ? (xie ? (compDone?'本区间已陪伴':'0 点 · 每区间 1 次')
           : (compDone?'本区间已陪伴':'0 点 · 不加好感 · 每区间 1 次'))
    : (!met?'先搭句话':compDone?'本区间已陪伴':'花 1 点 · 每区间 1 次');
  let h = `<div class="card">
        <div class="card-head">${avatarHtml(L.name,L.avatar)}
        <div class="card-body">
        <div class="ttl">${esc(L.name)}<small>${thLabel(L)} · ${tierName(L)}</small></div>
        <div class="desc">${esc(L.tag)}<br>${esc(L.car)}</div>
        <div class="gauge">${gauge}</div>
        </div></div>
        ${(met||(sr&&!xie))?'':`<button class="btn primary" data-act="meet" data-id="${L.id}"><b>初见 · 搭句话</b><small>不耗行动点 · 之后才能陪伴与深聊</small></button>`}
        <button class="btn" data-act="comp" data-id="${L.id}" ${(sr?compDone:(!met||compDone))?'disabled':''}><b>陪伴</b><small>${compSub}</small></button>
        ${sr?'':`<button class="btn" data-act="deep" data-id="${L.id}" ${deepReady?'':'disabled'}><b>${esc(L.sideQuest.name)}</b><small>${deepHint(L,deepDone,met,a)}</small></button>`}`;
  if(knower){
    const kLabel = (S.know[knowId]&&!kFull) ? '再找 '+knower.name+' 聊聊' : '找 '+knower.name+' 聊聊';
    const kSub = kFull ? '知情人 · 已聊透'
               : !S.know[knowId] ? '花 1 点 · 他肯说多少，看你到场时攒了什么'
               : '回访免费补听（已听到 +'+kGot+' ／ 上限 +'+KNOW_MAX+'）';
    h += `<button class="btn" data-act="know" data-id="${knowId}" ${kFull?'disabled':''}><b>${esc(kLabel)}</b><small>${kSub}</small></button>`;
  }
  h += `</div>`;
  return h;
}

function bgButton(n){
  const badge=n.dropper?' <span style="font-size:10px;color:var(--warn)">可掉落</span>':'';
  const done=(n.dropper&&S.flags['han_gave'])?' <span class="done">（已拿过弦）</span>':'';
  return `<button class="btn" data-act="bg" data-id="${n.id}"><b>${esc(n.name)}</b>${badge}${done}<small>${esc(n.car)}</small></button>`;
}

/* 【2026-11-07 批 3】二周目彩蛋 NPC：只在二周目、对应 zone 出现，标记「彩蛋」。
   每趟只结算一次；结算后 S.flags.eggDone[id]=true，不再显示。
   小字仍用 e.location（原地点描述），地点分区只按 locationId 归类，不改这行文案。 */
function eggButton(id){
  const e=EGGS[id];
  return `<button class="btn" data-act="egg" data-id="${id}"><b>${esc(e.name)}</b> <span style="font-size:10px;color:var(--accent)">· 彩蛋</span><small>${esc(e.location)}</small></button>`;
}

/* 【2026-11-06 C6 时序修复 · 死按钮一并修】zone6 时这个按钮原来仍走
   data-act="next"，而 nextZone() 第一行就 if(S.zone>=CFG.zones) return;
   → 点了没反应。改成 data-act="finale"，与分岔口页同一个问答入口；
   zone<6 仍走 next。当前 renderAll() 在 zone6 会把 scene 强切 finale，
   本按钮通常不上屏，但任何路径点到都不会再是死按钮。 */
function nextZoneBtn(){
  return `<div class="btn-row" style="margin-top:10px"><button class="btn ${S.zone<CFG.zones?'primary':'ok'}" data-act="${S.zone<CFG.zones?'next':'finale'}">${S.zone<CFG.zones?'前往下一区间 →':'到站 · 翻开手账'}</button></div>`;
}

/* ---------- 地点分区：这一节有谁 ----------
   下面四个函数是「标签人数」和「真渲染」的唯一口径：标签上写几个，
   点进去就一定渲染几条（同源，不各写一份）。 */
function locLoversAt(id){
  return activeLovers().filter(L=>L.difficulty!=='meta' && L.location===id);
}
function locBgAt(id){
  return BG_ALL.filter(n=>{
    if(isSecondRun() && n.secondRunHidden) return false;
    /* 二周目优先 locationSecondRun（加班运营二周目挪到硬座） */
    const at=(isSecondRun() && n.locationSecondRun) ? n.locationSecondRun : n.location;
    return at===id;
  });
}
function locEggsAt(id){
  if(!isSecondRun()) return [];
  return Object.keys(EGGS).filter(k=>{
    const e=EGGS[k];
    if(!e || typeof e!=='object' || !e.id) return false;   // easterEggs 里还混着一条 note 字符串，跳过
    return (e.locationId||'')===id && eggHere(k);
  });
}
function locKnowersAt(id){
  const out=[];
  locLoversAt(id).forEach(L=>{ const N=knowerAtLover(L); if(N) out.push(N.id); });
  return out;
}
/* 人数 = 该地点实际会渲染的条目数。祝颜 / 谢寻在工作人员区，不计入任何地点。 */
function locNpcCount(id){
  return locLoversAt(id).length + locKnowersAt(id).length
       + locBgAt(id).length + locEggsAt(id).length;
}
/* 常驻地点：数据层 locations.<id>.alwaysShow=true 的地点，即使 0 人也留在标签栏里。
   用于车尾 / 空车厢这类「剧情上玩家该知道能去、但大多数时候没人」的地方。 */
function locAlwaysShow(id){
  const L=LOCS[id]||{};
  return !!L.alwaysShow;
}

function renderLocBar(){
  const cur=S.location;
  /* 【2026-11-08】只显示「有人的地点」，空地点不占位（11 个压到 4~6 个）。
     两类例外：
       ① 当前地点无论人数都保留 —— 否则站在空地点（读档后原来的人已经走了）时，
          栏里连当前高亮项都没有，看着像坏了；
       ② locations.<id>.alwaysShow=true 的常驻地点（车尾 / 空车厢）—— 它们的条目
          只在很窄的条件窗口里出现（二周目 zone5 集齐碎片 / zone6 c4 done），
          不常驻的话一周目玩家永远不知道车能走到尾。
     人数口径仍走 locNpcCount()，与真渲染同源：标签上有几个，点进去就是几个。 */
  const tags=locOrder().filter(id=>id===cur || locNpcCount(id)>0 || locAlwaysShow(id)).map(id=>{
    const L=LOCS[id]||{};
    const on=(id===cur)?' on':'';
    const ic=(CFG.locationSystem.showIcons && L.icon) ? esc(L.icon)+' ' : '';
    const n=locNpcCount(id);
    const cnt=(CFG.locationSystem.showNpcCount && n>0) ? `<span class="lc">${n}</span>` : '';
    return `<div class="loc-tag${on}" data-act="loc" data-id="${esc(id)}">${ic}${esc(L.name||id)}${cnt}</div>`;
  }).join('');
  return `<div class="zone-loc-bar">${tags}</div>`;
}

/* 背景横幅：bg 空串就不写 background-image，留纯色底（--accent-soft）。
   图 404 也自然透出底色 —— 不加 onerror，避免内联事件。 */
function renderLocBg(){
  if(!CFG.locationSystem.showBackground) return '';
  const L=LOCS[S.location]||{};
  const bg=String(L.bg||'').replace(/['"()]/g,'');
  const style = bg ? ` style="background-image:url('${bg}')"` : '';
  return `<div class="loc-bg"${style}></div>`;
}

/* 当前地点 NPC：角色卡（含知情人按钮）→ 背景 NPC → 彩蛋；一条都没有时给一句空态。 */
function sceneByLocation(){
  let h = sceneCommon();
  h += renderLocBar();
  h += renderLocBg();
  const loc=S.location;
  const lovs=locLoversAt(loc), bgs=locBgAt(loc), eggs=locEggsAt(loc);
  lovs.forEach(L=>{ h += renderLoverCard(L); });
  bgs.forEach(n=>{ h += bgButton(n); });
  eggs.forEach(id=>{ h += eggButton(id); });
  /* 空态：地点可以在数据层配 emptyText（车尾 / 空车厢这类常驻空场用），没配就回退通用那句。 */
  if(!lovs.length && !bgs.length && !eggs.length){
    const emptyText=(LOCS[loc]||{}).emptyText || '这一节暂时没人。';
    h += `<div class="loc-empty">${esc(emptyText)}</div>`;
  }
  /* 工作人员：祝颜恒在（卡片/摆设按原开关回退）；谢寻只在二周目，切地点不消失。 */
  h += `<div class="staff-sec">工 作 人 员</div>`;
  h += zhuyanCard();
  if(isSecondRun() && LOVER_BY['xie_xun']) h += renderLoverCard(LOVER_BY['xie_xun']);
  h += nextZoneBtn();
  return h;
}

/* 改动前的车厢页：顺序一字不改（lovers → 祝颜 → 其 他 人 → 彩蛋 → 下一区间）。 */
function sceneLegacy(){
  let h = sceneCommon();
  activeLovers().forEach(L=>{ h += renderLoverCard(L); });
  h += zhuyanCard();
  h += `<div class="sec">车 厢 里 的 其 他 人</div>`;
  BG_ALL.forEach(n=>{
    if(isSecondRun() && n.secondRunHidden) return;
    h += bgButton(n);
  });
  if(isSecondRun()){
    Object.keys(EGGS).forEach(id=>{
      if(!eggHere(id)) return;
      h += eggButton(id);
    });
  }
  h += nextZoneBtn();
  return h;
}

const RENDERERS = {
  /* 【地点分区 v2】唯一分叉口：开关关掉 → sceneLegacy()，与改动前逐字相同。 */
  scene(){ return locOn() ? sceneByLocation() : sceneLegacy(); },

  /* 【2.6】主线任务页：双显示「记下 x / 读懂 y」+ 每枚按三态给动作。
     【第三批】终局 minClues 前置 BE 已删，这里也不写「还差几笔」的闸门文案（Q3 定稿）。 */
  mainline(){
    const n=clueCount(), y=interpretedCount();
    let h = `<div class="sec">主 线 · 这 趟 车 的 规 则</div>
      <div class="card">
        <div class="ttl">手账进度<small>记下 ${n} / ${CLUES.length} · 读懂 ${y} / ${CLUES.length}</small></div>
        <div class="desc">每一条线索分三步：把看见的东西先记下来，再找人问清楚，最后自己写下答案。写错改不了，想清楚再落笔。</div>
        <div class="gauge">别人说的没法带走，写错了就改不了，要想清楚再落笔哦~</div>
      </div>`;
    CLUES.forEach(c=>{
      const q=clueOf(c.zone);
      const notYet=c.zone>S.zone;   // 未抵达的区间：卡片可见，但没有热点按钮
      /* 【文案整理 v1 · 2.1】状态标签四档人话：还没看 / 记下了，还没问 / 问过了，还没写 / 写对了。
         未抵达区间不加标签（正文已经是「（车还没开到这一节）」）。 */
      const tag = q.found
        ? ({raw:'记下了，还没问',pending:'问过了，还没写',done:'写对了'}[q.state]||'—')
        : (notYet ? '' : '还没看');
      let body='',btns='';
      if(c.id==='c1' && q.state!=='done'){
        /* 【C1 三步教学】教学枚唯一入口：只有「进入教学」，不渲染通道 A/B，
           也不渲染 c2–c6 的圈词按钮（教学豁免 M2，点错在弹窗里重来）。 */
        body='记下的是：'+esc(c.record)+' ｜ '+esc(tutTag(c));
        btns=`<button class="btn" data-act="tutorial"><b>${esc(pendingText(tutUi(c).entryLabel,'进入教学 · 第 1 笔'))}</b><small>${esc(pendingText(tutUi(c).entryHint,'不耗行动点 · 点错可以重来'))}</small></button>`;
      } else if(!q.found){
        /* 线索的 source 字段是内部开发备注（设计来源 / 呼应原文哪一段），不上屏；
           数据层原样保留，渲染层不显示。下面紧跟的热点按钮本身就是引导。 */
        body=(notYet?'（车还没开到这一节）':'（这一区间还没看过）');
        btns=notYet?'':`<button class="btn" data-act="hotspot" data-z="${c.zone}"><b>看看这里有什么</b><small>不耗行动点 · 先看看这一节有什么</small></button>`;
      } else if(q.state==='raw'){
        body='记下的是：'+esc(c.record);
        btns=`<button class="btn" data-act="interpret" data-z="${c.zone}" data-via="conductor_f"><b>去问祝颜</b><small>${c.interpret.cost?'花 '+c.interpret.cost+' 点':'不耗点'} · trust +1</small></button>`
           + channelBButton(c);   /* 【2026-11-06 选人印证】B 按钮：via 白名单 / 候选空灰按钮 / 文案动态 */
      } else if(q.state==='pending'){
        /* 【②】forkFlag 枚在整句上方先给提示 + 题干；blank 枚不受影响 */
        body=quizHead(c)+'整句：'+esc(fullSentence(c))+(q.wrong?'<br><span class="desc">这一笔写错了，改不了。</span>':'');
        if(!q.wrong) btns=`<div class="desc">从下面挑关键点记进手账，注意写错就没法更改。</div>`
          + c.tokens.map(t=>`<button class="btn" data-act="write" data-z="${c.zone}" data-k="${esc(t.key)}"><b>${esc(tokenText(t))}</b></button>`).join('');
      } else {
        body='记下的是：'+esc(c.record)+' ｜ 写下的关键词：'+esc(keywordLabel(c,q.keyword))
           + (q.via==='tutorial'?'<br><span class="desc">'+esc(tutTag(c))+'</span>':'');
      }
      h += `<div class="card ${q.found?'':'ghost'}">
        <div class="ttl">第 ${c.zone} 区间<small>${tag}${q.wrong?' · 写错了，改不了':''}</small></div>
        <div class="desc">${esc(c.hook)}</div>
        <div class="gauge">${body}</div>
        ${btns}
        <button class="btn" data-act="reread" data-z="${c.zone}" style="margin-top:6px"><b>重读这一笔</b><small>不耗行动点 · 看看之前记了什么</small></button>
      </div>`;
    });
    /* 【2026-11-06 首周目谢寻巡查】手账杂记：主线 6 张卡片下方的小字单列一栏。
       不参与 clueCount() / interpretedCount()（那两个只读 S.clue），双显示「记下 x / 读懂 y」不变。 */
    if(Array.isArray(S.journalNotes) && S.journalNotes.length){
      h += `<div class="card journal-notes"><div class="ttl">${esc(JNOTES.sectionLabel||'杂记')}</div>`
        + S.journalNotes.map(n=>`<div class="note-small">${esc(n.text)}</div>`).join('') + `</div>`;
    }
    return h;
  },

  journal(){
    let h=`<div class="sec">好 感 与 关 系</div>`;
    activeLovers().forEach(L=>{
      const ok=reached(L), a=S.aff[L.id]||0;
      h+=`<div class="card"><div class="ttl">${esc(L.name)}<small class="${ok?'done':''}">${ok?'可达成':'未达标'}</small></div>
        <div class="gauge">好感 ${a} ｜ ${tierName(L)}（第 ${tierOf(L)} 阶）</div>
        <div class="gauge">初见 ${S.met[L.id]?'✓':'—'} ｜ 陪伴 ${S.compTimes[L.id]||0} 次 ｜ 深度 ${S.deep[L.id]?'✓':'—'}</div></div>`;
    });
    h+=`<div class="card"><div class="ttl">属性</div>
      <div class="gauge">记下 ${clueCount()} 笔 ｜ 读懂 ${interpretedCount()} 笔 ｜ 祝颜 trust ${S.trust}</div>
      <div class="gauge">背包：${Object.keys(S.bag).filter(k=>S.bag[k]>0).map(k=>esc((STORY.itemLabels||{})[k]||k)+'×'+S.bag[k]).join('、')||'空'}</div></div>`;
    /* 【2026-11-07 批 3 · 3.11】旧手账残页：手账页背包卡片下方加「使用」按钮（>0 时显示）。 */
    if((S.bag['旧手账残页']||0)>0){
      h += `<button class="btn" data-act="use-fragment"><b>使用旧手账残页</b><small>补记一条漏掉的线索</small></button>`;
    }
    /* 【2026-11-07 批 4 · 3.6】二周目旧记录 / 新记录双栏对照。只在二周目、有旧记录时显示。
       旧记录是模糊的（不能用于问答），新记录是二周目重新观察所得（可用于问答）。 */
    if(isSecondRun() && Array.isArray(S.oldRecords) && S.oldRecords.length){
      h += `<div class="sec">旧 记 录 与 新 记 录</div>
        <div class="tip">旧记录是上一趟留下的碎片，被雾抹过，不能用来填空。新记录是你这一趟重新看清的。</div>`;
      S.oldRecords.forEach(r=>{
        h += `<div class="card">
          <div class="ttl">旧记录<small>第 ${r.zone} 区间</small></div>
          <div class="gauge" style="opacity:.55">${esc(r.old)}</div>
          <div class="ttl" style="margin-top:8px">新记录</div>
          <div class="gauge">${esc(r.new)}</div>
        </div>`;
      });
      if(S.oldRecords.length < 3){
        h += `<div class="tip">还有 ${3 - S.oldRecords.length} 条旧记录没找到。</div>`;
      }
    }
    /* 第 7 课 · 回访清单：谁还没聊透、这一节在不在车上 */
    const kPending=Object.keys(KEY_BY).filter(id=>id!=='conductor_f'&&KEY_BY[id].for&&(S.knowBonus[id]||0)<KNOW_MAX);
    if(kPending.length){
      h+=`<div class="card"><div class="ttl">还 没 聊 透 的 人<small>回访免费</small></div>`
        + kPending.map(id=>{
            const N=KEY_BY[id];
            return `<div class="gauge">${esc(N.name)}　听到 +${S.knowBonus[id]||0} ／ 上限 +${KNOW_MAX}　${knowerHere(id)?'这一节在':'这一节没碰上'}</div>`;
          }).join('')
        + `<div class="desc">晚点再去，他肯说的会更多；回访不花行动点。</div></div>`;
    }
    const logs=S.log.length?S.log.map(x=>`<div>${esc(x)}</div>`).join(''):'<div>还没有记录。</div>';
    h+=`<div class="sec">手 账 记 事</div><div class="card log">${logs}</div>`;
    return h;
  },

  /* 第 6 区间：到站分岔台（问答 → 抉择，同一流程两步） */
  finale(){
    /* 【2026-11-06 C6 引导提示 · 方向 A】zone6 且 c6 未 done 时，在「翻开手账」按钮上方
       显示一行提示。只提示、不阻断、不强制：玩家可直接答题（C6 错过，按 Q3 容错），
       也可点提示切到主线页补做。c6 done / 字段缺失 → 不渲染、不报错。 */
    let c6Tip='';
    if(S.zone>=CFG.zones && clueOf(6).state!=='done'){
      const tip=finTip('c6GuideTip');
      if(tip){
        c6Tip=`<div class="c6-guide-tip" data-act="goto-mainline">`
            + (tip.text?`<p class="tip-main">${esc(tip.text)}</p>`:'')
            + (tip.hint?`<p class="tip-hint">${esc(tip.hint)}</p>`:'')
            + `</div>`;
      }
    }
    return `<div class="sec">列 车 到 站</div>
      <div class="card"><div class="ttl">分 岔 口</div>
        <div class="desc">南城、北市，还有第三块被雾糊住的站牌。<br>
        你手里只有一本手账。</div></div>
      ${c6Tip}
      <button class="btn primary" data-act="finale">翻开手账，回答问题</button>
      <div class="tip">问答不耗行动点。答案不考「雾是什么」，只看你把记下的几笔连不连得起来。</div>`;
  },

  ending(){
    /* 【2026-11-07 批 B′】按本局 runIndex 拆按钮：第 1 趟给「走第二趟 / 回到封面」，
       第 2 趟（一局走完）只给「合上手账」→ gameOver。旧的「重新登车」整条删除。
       tip 里的 M.playCount / M.glimpse 是全局周目记忆的累计展示，不是二周目内容门禁，
       按「第 3 趟起关闭二周目内容」语义原样保留。 */
    const isSecond = S.runIndex === 2;
    const btns = isSecond
      ? `<button class="btn ghost" data-act="goto-gameover">合上手账</button>`
      : `<div class="btn-row">
           <button class="btn primary" data-act="sr-entry">走第二趟</button>
           <button class="btn ghost" data-act="back-to-cover">回到封面</button>
         </div>`;
    return `<div class="sec">列 车 到 站</div>
      <div class="card"><div class="ttl" style="justify-content:center">${esc(S.endName)}</div>
        ${S.endWho?`<div class="desc" style="text-align:center">${esc(S.endWho)}</div>`:''}
        <div class="st" style="margin-top:10px">${nl2br(S.endText)}</div>
        ${S.endLine?`<div class="st" style="margin-top:10px"><span class="nm">「${esc(S.endLine)}」</span></div>`:''}</div>
      <div class="tip">周目记忆已更新（通关 ${M.playCount} 次${M.glimpse?'，已窥见雾的真相':''}）。</div>
      ${btns}`;
  },

  /* 【2026-11-07 批 B′】一局结束的感谢游玩画面。文案全在 secondRun.gameOver。
     text 是嘟嘟待补占位「【嘟嘟待补·…】」，不是【待写】前缀、pendingText() 不认，
     故这里加一道局部占位过滤 safe()（不改 pendingText 机制）：空串 / 「【待写…」/「【嘟嘟待补…」
     一律回退给定值，玩家只看到「— 完 —」+ 空正文，不露占位符。填正文时只改数据层，引擎零改动。 */
  gameOver(){
    const go=(STORY.secondRun||{}).gameOver||{};
    const safe=(v,fb)=>{
      const s=String(v||'');
      if(!s || /^【(嘟嘟待补|待写)/.test(s)) return fb;   // 局部占位过滤，仅本函数生效
      return s;
    };
    return `<div class="sec">游 戏 结 束</div>
      <div class="card" style="text-align:center">
        <div class="end-title">${esc(safe(go.title,'— 完 —'))}</div>
        <div class="st" style="margin-top:16px">${nl2br(safe(go.text,''))}</div>
      </div>
      <button class="btn ghost" data-act="back-to-cover">${esc(safe(go.button,'回到封面'))}</button>`;
  },

  /* 【2026-11-07 批 5 · 多槽存档】slots 数组驱动，不写死 4 张卡：
     自动槽（只读快照：继续 / 删除）+ 手动槽（读取 / 覆盖 / 删除，空槽＝保存到这里）。
     卡片只读 meta（轻量显示字段），不解析 S 全量——所有历史槽都能被旧档正常渲染。 */
  save(){
    if(!CFG.multiSlotSave.enabled) return RENDERERS.saveLegacy();
    const meta=readSlotMeta();
    const slots=[{id:CFG.saves.autoSlot,label:slotLabel(CFG.saves.autoSlot)}]
      .concat((CFG.saves.manualSlots||[]).map(id=>({id,label:slotLabel(id)})));
    const fmt=t=>{ const d=new Date(t); const p=n=>String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };
    const zoneLbl=m=>(Number(m.zone)>=CFG.zones)?'终点站':('第 '+m.zone+' 区间');
    const locLbl=m=>{ const L=(STORY.mainline.locations||{})[m.location]; return (L&&L.name)?L.name:''; };
    let h=`<div class="sec">存 档</div>
      <div class="tip">共 ${CFG.saves.totalSlots} 个存档位：${(CFG.saves.manualSlots||[]).length} 个手动 + 1 个自动。自动存档每次改动都更新；手动存档由你决定。周目记忆（通关 ${M.playCount} 次）单独存，读档不冲。</div>`;
    slots.forEach(s=>{
      const m=meta[s.id]||null;
      /* 有 meta 走完整卡片；没有 meta 但存档正文还在（旧档 / 换设备导入）也算「有档」，
         显示「刚开局」而不是空槽——否则旧档会看不见、点不到读取。 */
      const has=!!m || hasSlot(s.id);
      const isAuto=(s.id===CFG.saves.autoSlot);
      if(has){
        const sub=m?`${(Number(m.runIndex)===2?'二周目':'一周目')} · ${zoneLbl(m)}${locLbl(m)?' · '+esc(locLbl(m)):''} · ${fmt(m.savedAt)}`:'存档时间未知';
        const desc=m?(m.endName?('已通关：'+esc(m.endName)):(m.topAff?('最高好感：'+esc(m.topAff.name)+' '+m.topAff.value):'刚开局')):'刚开局';
        h+=`<div class="card">
          <div class="ttl">${s.label}<small>${sub}</small></div>
          <div class="desc">${desc}</div>
          <div class="btn-row">
            <button class="btn" data-act="load" data-id="${s.id}">${isAuto?'继续':'读取'}</button>
            ${isAuto?'':`<button class="btn" data-act="save-over" data-id="${s.id}">覆盖</button>`}
            <button class="btn ghost" data-act="del-slot" data-id="${s.id}">删除</button>
          </div>
        </div>`;
      } else {
        h+=`<div class="card ghost">
          <div class="ttl">${s.label}<small>空</small></div>
          <div class="desc">${isAuto?'（开始游戏后自动生成）':'还没有存档。'}</div>
          ${isAuto?'':`<button class="btn" data-act="save" data-id="${s.id}">保存到这里</button>`}
        </div>`;
      }
    });
    h+=`<button class="btn" data-act="export">导出存档码</button>
      <button class="btn" data-act="import">导入存档码</button>
      <button class="btn" data-act="restart" style="color:var(--warn)">重新登车</button>`;
    return h;
  },
  /* 【批 5】旧单槽存档页：CFG.multiSlotSave.enabled=false 时的回退目标。
     与改造前逐字一致，键名仍 fog5_1；保留是为了让开关有真实可回退的落点，不是死代码。 */
  saveLegacy(){
    return `<div class="sec">存 档</div>
      <div class="tip">每次改动自动存。周目记忆（通关 ${M.playCount} 次）单独存，读档不冲。</div>
      <div class="btn-row"><button class="btn" data-act="save" data-id="1">存入槽位 1</button><button class="btn" data-act="load" data-id="1">读取槽位 1</button></div>
      <button class="btn" data-act="export">导出存档码</button>
      <button class="btn" data-act="import">导入存档码</button>
      <button class="btn" data-act="restart" style="color:var(--warn)">重新登车</button>`;
  }
};

function thLabel(L){ return {normal:'普通',hard:'困难',conditional:'条件',meta:'隐藏'}[L.difficulty]||''; }
/* 【2026-11-07 清理批】门槛数值一律不上屏：全部调用点已删，此函数只留作内部口径查询。
   判定本身仍走 reached() / CFG.threshold，改数值只改数据层的 CFG，不动这里。 */
function thText(L){
  if(L.difficulty==='normal') return '≥'+CFG.threshold.normal;
  if(L.difficulty==='hard') return `好感≥${CFG.threshold.hard.aff} 且 读懂≥${CFG.threshold.hard.interpretedCount} 笔`;
  if(L.difficulty==='conditional') return `≥${CFG.threshold.conditional} 且 走完他的支线`;
  return '—';
}
function reached(L){
  const a=S.aff[L.id]||0;
  if(L.difficulty==='normal') return a>=CFG.threshold.normal;
  // 【2.4 / Q1④】courage>=40 → interpretedCount>=4；courage 不再参与任何判定
  if(L.difficulty==='hard') return a>=CFG.threshold.hard.aff && interpretedCount()>=CFG.threshold.hard.interpretedCount;
  // conditional 的信物会在深度事件里被消耗掉，所以绝不能检查「当前持有」，
  // 否则会出现「做完深度反而永远拿不到 HE」的死锁。深度完成＝信物已交还。
  if(L.difficulty==='conditional') return a>=CFG.threshold.conditional && !!S.deep[L.id];
  return false;
}
/* 深度按钮下方的小字：只写公开条件。隐藏前置一个字都不许漏。 */
function deepHint(L,deepDone,met,a){
  if(deepDone) return '（已完成）';
  if(!met) return '先搭句话';
  if(a<CFG.deepUnlock) return '还不到时候';
  return '花 1 点 · 深度事件';
}
function achievedList(){ return activeLovers().filter(reached); }

function renderAll(){
  if(!S) return;
  $('h-name').textContent=S.name;
  $('h-date').textContent=(isSecondRun()?'第 '+(S.runIndex||2)+' 趟 · ':'')
    +(S.zone>=CFG.zones?'终点站':('第 '+S.zone+' / '+CFG.zones+' 区间'));
  const total=actionTotal();
  let ap=''; for(let i=0;i<total;i++) ap+=`<i class="${i<total-S.actionsLeft?'':'used'}"><b></b></i>`;
  $('h-ap').innerHTML=ap;
  let tab=S.tab||'scene';
  if(S.zone>=CFG.zones){
    /* 【2026-11-07 批 B′】gameOver 是终点站之后唯一的合法页，
       不能被 S.endId 强制拉回结局页；否则「合上手账」点了没反应。 */
    if(tab!=='gameOver'){
      if(S.endId) tab='ending';
      else if(tab==='scene') tab='finale';
    }
  }
  $('tabs').innerHTML=TABS.map(t=>`<button data-tab="${t.id}" class="${tab===t.id?'on':''}"><span class="ic">${t.ic}</span>${t.name}</button>`).join('');
  $('stage').innerHTML=(RENDERERS[tab]||RENDERERS.scene)();
  $('stage').scrollTop=0;
}

/* ---------- ⑤ 动作 ---------- */
/* ── 【2026-11-06 二周目第一批 / 2026-11-07 扩面第一批】常规角色陪伴分流（五位常规角色均已配 L.secondRun）──
   · 引擎按「L.secondRun 是否存在」通用分流：后续给其余四位补数据即可，不必再改引擎。
   · 铁律仍是只改 S、画面由 S 重生成；二周目陪伴不加 aff / trust / 不推线索 / 不触发深度 /
     不进分岔台，0 行动点＝整段绕过 costAction()（该函数无参数，不能把 cost 设 0）。
   · 文案全在 STORY.lovers[].secondRun 与 STORY.secondRun，引擎零硬编码台词。 */
function srLover(L){ return isSecondRun() && !!(L && L.secondRun); }
function srActComp(L,key,id){
  if(S.comp[key]) return;                       // 每区间限一次（沿用 S.comp 区间锁）
  S.comp[key]=true;                            // 0 点：不调 costAction()
  S.compTimes[id]=(S.compTimes[id]||0)+1;
  /* 【批 1 · 3.3】谢寻二周目陪伴加好感：companion.aff 存在才加（常规二周目角色该字段缺省＝0，不加）。 */
  const affGain=(L.secondRun&&L.secondRun.companion&&L.secondRun.companion.aff)||0;
  if(affGain>0) S.aff[id]=(S.aff[id]||0)+affGain;
  const n=S.compTimes[id];
  S.flags=S.flags||{}; S.flags.obsessionReply=S.flags.obsessionReply||{};
  const d=L.secondRun.obsessionReply||{}, rule=(STORY.secondRun||{}).obsessionReply||{};
  const trig=rule.triggerCount||4;
  if(n>=trig && rule.once!==false && !S.flags.obsessionReply[id] && d.line){
    /* 执念回应：第 4 次起播一段（n>=trig；某角色缺 line 时第 4 次跳过、第 5 次可补触发），
       两选项同后续，播完回固定第 2 句循环；每角色只一次。
       提前置位而不是「播完」再置，防止玩家关窗后重复触发（不改变任何数值）。 */
    S.flags.obsessionReply[id]=true;
    addLog('第 '+n+' 次陪'+L.name+'，他好像注意到了什么。');
    const follow=`<span class="nm">${esc(L.name)}</span><br>`
      +(d.followUpStage?esc(d.followUpStage)+'<br>':'')+esc(d.followUp)+'<br>'
      +(d.closingStage?esc(d.closingStage)+'<br>':'')+esc(d.closing);
    const opts=(d.options||[]).map(o=>({t:esc(o),fn:()=>pushEvent(follow,[{t:'知道了',fn:()=>{}}])}));
    if(!opts.length) opts.push({t:'知道了',fn:()=>{}});
    pushEvent(`<span class="nm">${esc(L.name)}</span><br>${esc(d.line)}`,opts);
    afterChange(); flushEvents();
    return;
  }
  /* B6：1→第 1 句；2、3→第 2 句；4 且已触发过→第 2 句；>4→第 2 句 */
  const lines=(L.secondRun.companion||{}).lines||[];
  const line=lines[n<=1?0:Math.min(1,lines.length-1)]||'';
  addLog('陪伴了'+L.name+(affGain?`（二周目：好感 +${affGain}）`:'（二周目：0 点、不加好感）')+'。');
  pushEvent(`<span class="nm">${esc(L.name)}</span><br>${esc(line)}`,[{t:'记下这一刻',fn:()=>{}}]);
  /* 【批 1 · 3.4】谢寻陪伴后若已达旧照片事件条件，把事件压入事件队列（闭合陪伴弹窗后自动续播）。 */
  if(L.id==='xie_xun') maybeTriggerXieXunPhoto();
  afterChange(); flushEvents();
}
/* 初见台词解析：【批 1 · 3.2】谢寻的 firstLine 是对象（firstRun / secondRun），
   其余角色是字符串。统一走 firstLineOf()：二周目取 secondRun、一周目取 firstRun，无则回退。 */
function firstLineOf(L){
  const f=L.firstLine;
  if(typeof f==='string') return f;
  if(f && typeof f==='object'){
    if(isSecondRun() && f.secondRun) return f.secondRun;
    if(!isSecondRun() && f.firstRun) return f.firstRun;
    return f.firstRun||f.secondRun||'';
  }
  return '';
}
/* 初见：免费，不耗行动点。只把「见过面」写进 S，并弹一次 firstLine。 */
function actMeet(id){
  const L=LOVER_BY[id]; if(!L||S.met[id]) return;
  /* 【二周目第一批 · 3.2】skipFirstLine：二周目常规角色不播初见、也不写 S.met；
     陪伴入口另走 srActComp()，不依赖 S.met。谢寻 skipFirstLine=false，照常播初见。 */
  if(srLover(L) && L.secondRun.skipFirstLine) return;
  S.met[id]=1;
  addLog('第一次和'+L.name+'搭上话。');
  pushEvent(`<span class="nm">${esc(L.name)}</span><br>${esc(firstLineOf(L))}`,[{t:'记下这一刻',fn:()=>{}}]);
  afterChange(); flushEvents();
}
function actComp(id){
  const L=LOVER_BY[id], key=id+':'+S.zone;
  /* 【二周目第一批】常规角色分流：只改 S，不加好感、不耗点、不播初见 */
  if(srLover(L)) return srActComp(L,key,id);
  if(!S.met[id]){ pushEvent('你还没和'+esc(L.name)+'说过话。',[{t:'先去搭句话',fn:()=>{}}]); return flushEvents(); }
  if(S.comp[key]||!costAction()) return;
  S.comp[key]=true;
  S.aff[id]=(S.aff[id]||0)+CFG.companionBonus;
  S.compTimes[id]=(S.compTimes[id]||0)+1;
  const t=tierOf(L);                  // 用「加完好感之后」的阶取陪伴台词
  const line=compLine(L,t);
  S.tierComp[id+':'+t]=(S.tierComp[id+':'+t]||0)+1;
  addLog('陪伴了'+L.name+'，好感 +'+CFG.companionBonus+'（当前「'+tierName(L)+'」）。');
  pushEvent(`<span class="nm">${esc(L.name)}</span> · ${tierName(L)}<br>${esc(line)}`,[{t:'记下这一刻',fn:()=>{}}]);
  afterChange(); flushEvents();
}
function actDeep(id){
  const L=LOVER_BY[id]; if(!L||S.deep[id]) return;
  // ①② 公开条件（界面已按同样规则置灰，这里再挡一次，防读档/改档绕过）
  if(!S.met[id]){ pushEvent('你还没和'+esc(L.name)+'说过话。',[{t:'知道了',fn:()=>{}}]); return flushEvents(); }
  if((S.aff[id]||0)<CFG.deepUnlock){ pushEvent('话到嘴边，又觉得还不到时候。',[{t:'改天再说',fn:()=>{}}]); return flushEvents(); }
  // ③ 隐藏条件：不提示、不扣行动点、不置完成，只给一句角色台词。缺什么，玩家自己琢磨。
  const hp=CFG.hiddenPre[id];
  if(hp && !S.flags[hp.flag]){
    pushEvent(`<span class="nm">${esc(L.name)}</span><br>${esc(hp.soft)}`,[{t:'不勉强他',fn:()=>{}}]);
    return flushEvents();
  }
  // 条件角色的信物：内部检查，界面上不出现任何提示
  const need=L.difficulty==='conditional'?CFG.itemFor[id]:null;
  if(need&&!((S.bag[need]||0)>0)){
    pushEvent(`<span class="nm">${esc(L.name)}</span><br>${esc(hp?hp.soft:'他摇了摇头，今天似乎不是时候。')}`,[{t:'不勉强他',fn:()=>{}}]);
    return flushEvents();
  }
  if(!costAction()) return;
  if(need){ S.bag[need]--; if(S.bag[need]<=0) delete S.bag[need]; }
  S.deep[id]=true; S.aff[id]=(S.aff[id]||0)+CFG.deepBonus;
  addLog('完成'+L.name+'的深度事件「'+L.sideQuest.name+'」，好感 +'+CFG.deepBonus+'。');
  pushEvent(`<span class="nm">${esc(L.name)}</span> · ${esc(L.sideQuest.name)}<br>${esc(L.sideQuest.text)}`,[{t:'记进手账',fn:()=>{}}]);
  afterChange(); flushEvents();
}
/* ---------- 第 7 课：重要 NPC 探索 ----------
   A 分段爆料：首次 1 点，按「到场时攒了什么」给 +2 / +4 / +6；
               条件变多后再来「回访」免费补差额，不增加 13 点预算。
   C 场景门槛：不在本区间的人渲染层就不出现，这里再挡一次防读档绕过。
   B 情报交叉：俞星单独走 actKnowYuXing。 */
function actKnow(id){
  const N=KEY_BY[id]; if(!N) return;
  if(!knowerHere(id)) return;
  /* 【批 1 · 2.3】二周目老冯专属对话：餐车信息枢纽，讲谢寻旧事，记线索 tag（laofeng_dialog）。
     0 行动点（信息枢纽定位）；once：本局只讲一次；不代写台词，casual/deep 逐字取自数据。 */
  if(isSecondRun() && N.secondRunDialogues){
    if(S.flags.laofengDialogDone){
      pushEvent(`<span class="nm">${esc(N.name)}</span><br>「该说的都跟你说了，剩下的……你自己看吧。」`,[{t:'合上手账',fn:()=>{}}]);
      return flushEvents();
    }
    S.flags=S.flags||{}; S.flags.laofengDialogDone=true;
    const d=N.secondRunDialogues;
    S.clueTags=S.clueTags||{}; S.clueTags[d.tag]=true;
    if(d.journalNote) pushJournalNote({source:d.tag,zone:S.zone,text:d.journalNote});
    addLog('在餐车听老冯讲起谢寻的事。');
    pushEvent(`<span class="nm">${esc(N.name)}</span><br>${esc(d.casual)}<br><span class="desc">（他说完沉默了一会儿。）</span><br>${esc(d.deep)}`,
      [{t:'记下',fn:()=>{}}]);
    afterChange(); flushEvents(); return;
  }
  if(id==='yu_xing'&&CROSS) return actKnowYuXing(N);

  const hits=knowerHits(N), bonus=knowerBonusOf(hits);
  const paid=!!S.know[id], prev=S.knowBonus[id]||0;
  const delta=Math.max(0,bonus-prev);
  if(paid&&delta<=0){
    pushEvent(`<span class="nm">${esc(N.name)}</span><br>「该说的我都说了，剩下的得你自己去看。」`,[{t:'合上手账',fn:()=>{}}]);
    return flushEvents();
  }
  if(!paid&&!costAction()) return;          // 只有首次花行动点
  S.know[id]=1;
  if(delta>0){
    if(N.for&&LOVER_BY[N.for]) S.aff[N.for]=(S.aff[N.for]||0)+delta;
    S.knowBonus[id]=bonus;
    addLog((paid?'回访':'听')+N.name+'讲起'+(N.for?LOVER_BY[N.for].name:'')+'的事，理解 +'+delta+'（累计 +'+bonus+'）。');
  }
  const tail = paid ? '<br><span class="desc">（这次他把上次咽回去的半句也说完了。）</span>'
           : hits<4 ? '<br><span class="desc">（他像是还有话没说完。）</span>' : '';
  pushEvent(`<span class="nm">${esc(N.name)}</span><br>${esc(knowLine(N,hits))}${tail}`,
    [{t:paid?'记下了':'先记下这些',fn:()=>{}}]);
  afterChange(); flushEvents();
}

/* B 情报交叉（只给俞星）：他只肯说半句，得拿玩家自己记下的一笔去印证。
   呼应 R2「转述的答案会被雾抹掉，只有自己记下来的算数」。
   需要手账第 4 笔 + 先见过温叙本人，所以自然要等到第 4 区间以后再来。 */
function actKnowYuXing(N){
  const id='yu_xing';
  /* 【M5】读第 4 枚这一笔的 state==='done'，不读 interpretedCount 总数；
     【M6】通道 B 只给好感 + 咬合台词，不碰 S.deep。与 JSON crossCheck.yu_xing.check 对齐。 */
  const canCross=clueOf(CROSS.clueZone).state==='done' && !!S.met[CROSS.needMet];
  const crossed=!!S.flags[CROSS.flag];
  const paid=!!S.know[id];
  if(crossed){
    pushEvent(`<span class="nm">${esc(N.name)}</span><br>${esc(N.text||'')}<br><span class="desc">（那页手账还夹在原来的位置。）</span>`,[{t:'合上手账',fn:()=>{}}]);
    return flushEvents();
  }
  if(!paid&&!costAction()) return;
  S.know[id]=1;
  // 半句的好感立即入账（与其他知情人一致），印证成功时再补差额
  const prev0=S.knowBonus[id]||0, halfDelta=Math.max(0,CROSS.bonusHalf-prev0);
  if(halfDelta>0){
    S.knowBonus[id]=CROSS.bonusHalf;
    if(LOVER_BY[CROSS.needMet]) S.aff[CROSS.needMet]=(S.aff[CROSS.needMet]||0)+halfDelta;
    addLog('俞星只说了半句，理解 +'+halfDelta+'。');
  }
  const segs=knowSegs(N);
  const halfText=segs.length>1?segs[0]+'……':(N.text||'');
  const opts=[];
  if(canCross){
    opts.push({t:'翻到手账第 '+CROSS.clueZone+' 笔，递给他看',fn:()=>{
      S.flags[CROSS.flag]=1;
      const prev=S.knowBonus[id]||0, delta=Math.max(0,CROSS.bonus-prev);
      S.knowBonus[id]=CROSS.bonus;
      if(delta>0&&LOVER_BY[CROSS.needMet]) S.aff[CROSS.needMet]=(S.aff[CROSS.needMet]||0)+delta;
      addLog('用手账第 '+CROSS.clueZone+' 笔问出了俞星的半句话，理解 +'+delta+'。');
      pushEvent(`<span class="nm">${esc(N.name)}</span><br>他盯着那一行字看了很久，才把后半句说完：<br>${esc(N.text||'')}<br><span class="desc">（转述的没用，得是你自己记下来的。）</span>`,[{t:'记进手账',fn:()=>{}}]);
    }});
  }
  opts.push({t:canCross?'先收起手账':'先记下这半句',fn:()=>{}});
  const hint = canCross ? '<br><span class="desc">（你手账里那一笔，好像正好对得上。）</span>'
                        : '<br><span class="desc">（他话到嘴边又停住了，像在等什么能作证的东西。）</span>';
  pushEvent(`<span class="nm">${esc(N.name)}</span><br>${esc(halfText)}${hint}`,opts);
  afterChange(); flushEvents();
}
/* ---------- 【第二批 2.2】线索三态的三个动作 ----------
   铁律：只改 S.clue[zone]，画面由 S 重生成；STORY 的 state 模板绝不写回。 */
function actHotspot(z){
  const c=clueByZone(z); if(!c) return;
  if(c.id==='c1'){ return tutorialEntry(); }   // 【C1】教学弹窗是唯一入口
  // 不回归门槛：旧版 autoRecord 按区间自动记，改手动点热点后仍要「车开到哪一节才看得见哪一节」。
  if(c.zone>S.zone){
    pushEvent('车还没开到那一节，这一页先空着。',[{t:'合上手账',fn:()=>{}}]); return flushEvents();
  }
  const q=clueOf(c.zone);
  if(q.found){ pushEvent('这一笔已经记下了。',[{t:'合上手账',fn:()=>{}}]); return flushEvents(); }
  /* 【FAST · 2.1】二周目：点热点直接进 pending，省掉「去问祝颜」这一步。
     顺序不可换：found 检查（上一行）→ 扣点（失败即 return，手账保持空白）→ 置状态 → 补旧记录碎片。
     扣点必须在置状态之前，否则「点数不够」时会留下一个 found 却写不了的死格子。 */
  if(fastOn()){
    if((c.interpret.cost||0)>0 && !costAction()) return;
    q.found=true; q.state='pending'; q.via='secondRun';
    /* actInterpret 的通道 A 分支是这条旧记录碎片的唯一原调用点；fast 绕过后必须在这里补一次。
       acquireOldRecord 内部幂等（已有即跳过），c2–c6 每次点热点都调无害。
       放扣点之后，避免「没扣点却拿到碎片」。 */
    acquireOldRecord('zhuyan_watching_fog');
    addLog('点开第 '+c.zone+' 区间的线索，记下：'+c.record+'。');
    /* 弹窗整段复刻 actInterpret 的 pushEvent：必须带 quizHead(c) + fullSentence(c)。
       c5／c6 是 forkFlag 枚，quizHead 是「这三枚不填进那三句话」的唯一提示，丢了玩家会误填三空。
       只把 line（祝颜 + trustLine）换成新引导语，其余与通道 A 逐字一致。 */
    pushEvent(`<span class="nm">手账 · 第 ${c.zone} 笔</span><br>${esc(c.hook)}<br>
      <span class="desc">这一趟你带着记忆回来，不用再问一遍。看清整句，自己挑一句写下来。</span><br><br>`
      + quizHead(c)
      + `<span class="nm">整句</span><br>${esc(fullSentence(c))}
      <br><span class="desc">看清整句话之后，需要就从选项中挑一句你觉得最对的关键点，注意：选错了就不能更改了哦~</span>`,
      c.tokens.map(t=>({t:'就是这句：'+tokenText(t),fn:()=>actWriteKeyword(c.zone,t.key)})));
    afterChange(); flushEvents(); return;
  }
  q.found=true; q.state='raw';             // P1：点热点不写 pending，raw→pending 交给 actInterpret
  /* 热点区间锁保留；【甲】全部 clues[].hotspot.trustDelta 已归零，
     trust 只由教学 + 通道 A 增长，这里自然不再加成（旧 M3 修法 A 退休，说明见数据）。
     zone5 补点 c4 仍可 found=true（Q3：漏不是失败），只是不再额外加 trust。 */
  const td=(S.zone===c.zone)?(c.hotspot.trustDelta||0):0;
  if(td) addTrust(td);
  addLog('点开第 '+c.zone+' 区间的线索，记下：'+c.record+(td?'（trust +'+td+'）':'')+'。');
  pushEvent(`<span class="nm">手账 · 第 ${c.zone} 笔</span><br>${esc(c.hook)}<br>
    <span class="desc">记下的是：${esc(c.record)}${td?' ｜ trust +'+td:''}</span><br>
    <span class="desc">这一笔还只是记下，还没问过。去主线页找人问问，再自己写下答案。</span>`,
    [{t:'先记下这些',fn:()=>{}}]);
  afterChange(); flushEvents();
}
/* 【2026-11-06 通道 B 改「选人印证」· 嘟嘟拍板 A 方案】
   旧 L1 lover → L2 knower → L3 最高好感 的自动落点整段删除：
     它会让「问 c2 却刷到林昼」、让知情人说别人的台词、让 c6 门禁形同虚设，
     还会在没人初见时硬记一条 via='knower' 的假出场。
   现行：玩家从「已初见的可攻略角色」里选一人印证，选对 +2 读本人 hint，
   选错 +0 读模糊串；两种情况都进 pending、都给关键词、都扣 1 行动点。 */
function channelBUi(){ return STORY.mainline.clueScaffold.finale.uiTexts||{}; }
/* 3.2 门禁①：via 白名单。c6 只有 conductor_f → 不渲染 B 按钮；c1 只有 tutorial 同理。 */
function channelBAllowed(c){
  const v=(c&&c.interpret&&c.interpret.via)||[];
  return v.indexOf('knower')>=0 || v.indexOf('lover')>=0;
}
/* 3.1 候选：已初见的可攻略角色。项目设定恋人全车常驻（carriageMap 不设区间限制），
   所以「本区间在场」＝已初见；LOVERS 已过滤 difficulty==='meta' 的谢寻（隐藏二周目）。 */
function channelBCandidates(c){
  /* 【批 1 · 3.1】通道 B 永不收谢寻：显式排除 meta，不用已含谢寻的 activeLovers()。 */
  return c ? LOVERS_ALL.filter(L=>L.difficulty!=='meta' && S.met[L.id]) : [];
}
/* 3.1 绑定：只用来比对玩家选的人对不对，不再自动落点。 */
function channelBBind(c){
  return (c&&c.interpret&&c.interpret.channelB||{}).loverId || null;
}
/* 2.1 选对时按 loverId 取本人那句；选错不读这里（读 channelBWrong）。 */
function channelBHint(c,picked){
  const h=c&&c.interpret&&c.interpret.hint;
  return (h&&typeof h==='object') ? pendingText(h[picked],'') : '';
}
/* 【2026-11-06 短句上屏】选人面板每个按钮的「你注意到的事」。
   按 clueId + 选中人 id 从 uiTexts.channelBPanel 取 note；4 面板各 5 条，覆盖 5 位 LOVERS。
   若未来新增可攻略角色导致缺 note → 返回空串，<small> 不渲染、不报错，不加兜底串。 */
function channelBNote(c,id){
  const p=channelBUi().channelBPanel||{};
  const arr=(c&&p[c.id])||[];
  const hit=arr.find(x=>x.id===id);
  return hit?pendingText(hit.note,''):'';
}
/* 模板：{name} → 选中人名；第一个「……」→ 印证文本（本人 hint 或模糊串）。 */
function channelBTemplate(tpl,name,text){
  return String(tpl||'').replace('{name}',name).replace('……',text);
}
/* 3.4 按钮：白名单不通过 → 完全不渲染；候选为空 → ghost 灰按钮 + channelBNone 文案。
   不用 disabled（会拦住点击、弹不出提示）；点击由 actInterpret 弹提示且不扣行动点。 */
function channelBButton(c){
  if(!channelBAllowed(c)) return '';
  if(fastOn()) return '';                  // 【FAST · 2.2】二周目不渲染通道 B（回到按钮：关开关即恢复）
  const u=channelBUi(), cand=channelBCandidates(c);
  const costTxt=c.interpret.cost?'花 '+c.interpret.cost+' 点':'不耗点';
  if(!cand.length)
    return `<button class="btn ghost" data-act="interpret" data-z="${c.zone}" data-via="channelB"><b>${esc(pendingText(u.channelBNone,'还没认识车上的人。'))}</b><small>${costTxt}</small></button>`;
  return `<button class="btn" data-act="interpret" data-z="${c.zone}" data-via="channelB"><b>去问车上认识的人</b><small>${costTxt} · 选对人可以加对应好感</small></button>`;
}
function actInterpret(z,via,picked){
  const c=clueByZone(z); if(!c) return;
  /* 【C1 三步教学】4.3 入口：教学枚只走弹窗，不走通道 A/B、不扣点、不进 c2–c6 判定链。 */
  if(c.id==='c1' && (c.interpret.via||[]).indexOf('tutorial')>=0) return tutorialEntry();
  const q=clueOf(c.zone);
  if(!q.found){ pushEvent('你还没在这一区间看看有什么，手账上是空的。',[{t:'回去看看',fn:()=>{}}]); return flushEvents(); }
  if(q.state!=='raw'){ pushEvent('这一笔已经问过了。',[{t:'合上手账',fn:()=>{}}]); return flushEvents(); }
  /* 3.2 门禁②：即使绕过按钮直接调用，也不让 c1/c6 走通道 B。 */
  if(via!=='conductor_f' && !channelBAllowed(c)){
    pushEvent('<span class="desc">这一笔只能去问祝颜。</span>',[{t:'知道了',fn:()=>{}}]);
    return flushEvents();
  }
  if(via!=='conductor_f'){
    const cand=channelBCandidates(c);
    if(!cand.length){                       // 灰按钮点击 / 直接调用：不扣点
      pushEvent(`<span class="desc">${esc(pendingText(channelBUi().channelBNone,'还没认识车上的人。'))}</span>`,
        [{t:'知道了',fn:()=>{}}]);
      return flushEvents();
    }
    if(!picked || !cand.some(L=>L.id===picked)){
      /* 3.3 选人面板：复用 pushEvent 事件队列，不新增组件；这一步不扣行动点。
         【2026-11-06 短句上屏】按钮 = 角色名 + <small>「你注意到的事」</small>。
         note 由 channelBNote(c,id) 读 uiTexts.channelBPanel[c.id]（4 面板 × 5 条，覆盖 5 位 LOVERS）；
         flushEvents 的 o.hint 已负责输出 <small>，这里只传值，不新开面板、不加兜底串。
         channelBCandidates 仍只按 S.met 过滤（恋人全车常驻、引擎无 inZone），最多列 5 人，
         5 人全有 note，故 <small> 永不空。正确项第一 / 强干扰第二 / 3 条弱干扰的排序在数据层。 */
      const u=channelBUi();
      pushEvent(`<span class="nm">${esc(pendingText(u.channelBPickTitle,'问谁？'))}</span><br>`
        + `<span class="desc">${esc(pendingText(u.channelBPickHint,'只列出这个区间里、你认识的人。'))}</span>`,
        cand.map(L=>({t:esc(L.name),hint:esc(channelBNote(c,L.id)),fn:()=>actInterpret(z,'channelB',L.id)})));
      return flushEvents();
    }
  }
  const cost=c.interpret.cost||0;
  if(cost>0&&!costAction()) return;       // 选完人才扣点；选人面板 / 灰按钮都不扣
  let line='';
  if(via==='conductor_f'){
    addTrust(1);                          // 【甲】通道 A 给 trust（纯数值，clamp 到 5）
    acquireOldRecord('zhuyan_watching_fog');   // 【批 4】首次通道 A 获得「祝颜看雾」（内部幂等）
    q.via='conductor_f';
    line=`<span class="nm">${esc((KEY_BY['conductor_f']||{}).name||'祝颜')}</span><br>${esc(trustLine(c))}<br>
      <span class="desc">（trust ${S.trust}）</span>`;
    q.state='pending';                      // Q2：NPC 印证过，待玩家自己写
    addLog('问了第 '+c.zone+' 笔，待写下关键词。');
    /* 【批 2】通道 A 也给二周目高档台词：trust 到档位时，先播她自己的事，再播解读结果。
       maybePlaySecondRunTier 内部若没有新高档会直接 callback，不影响一周目 / 二周目未达档位的情况。 */
    maybePlaySecondRunTier(()=>{
      pushEvent(line+`<br><br>`+quizHead(c)+`<span class="nm">整句</span><br>${esc(fullSentence(c))}
        <br><span class="desc">看清整句话之后，需要就从选项中挑一句你觉得最对的关键点，注意：选错了就不能更改了哦~</span>`,
        c.tokens.map(t=>({t:'就是这句：'+tokenText(t),fn:()=>actWriteKeyword(c.zone,t.key)})));
      afterChange(); flushEvents();
    });
    return;
  } else {
    const u=channelBUi(), L=LOVER_BY[picked];
    const right=(channelBBind(c)===picked);
    const text=right ? (channelBHint(c,picked)||pendingText(u.channelBWrong,'……这个我说不好。'))
                     : pendingText(u.channelBWrong,'……这个我说不好。');
    if(right) S.aff[picked]=(S.aff[picked]||0)+CFG.channelBAff;
    q.via='lover'; q.speaker=picked;       // 存档如实记录出场者，不再写假 knower
    const tpl=right?pendingText(u.channelBResultRight,'{name}说：……（好感 +2）')
                   :pendingText(u.channelBResultWrong,'{name}说：……（好感 +0）');
    line=`<span class="nm">${esc(channelBTemplate(tpl,L.name,text))}</span>`;
    q.state='pending';                      // Q2：NPC 印证过，待玩家自己写
    addLog('问了第 '+c.zone+' 笔，待写下关键词。');
    /* 【②】forkFlag 枚（C5/C6）先给提示 + 题干，再给整句；blank 枚 quizHead 返回空串 */
    pushEvent(line+`<br><br>`+quizHead(c)+`<span class="nm">整句</span><br>${esc(fullSentence(c))}
      <br><span class="desc">看清整句话之后，需要就从选项中挑一句你觉得最对的关键点，注意：选错了就不能更改了哦~</span>`,
      c.tokens.map(t=>({t:'就是这句：'+tokenText(t),fn:()=>actWriteKeyword(c.zone,t.key)})));
    afterChange(); flushEvents();
  }
}
function actWriteKeyword(z,key){
  const c=clueByZone(z); if(!c) return;
  if(c.id==='c1'){ return tutorialEntry(); }   // 【C1】教学豁免 M2，圈词只在教学弹窗里发生
  const q=clueOf(c.zone);
  if(q.state!=='pending'||q.wrong){
    pushEvent('这一笔已经写定了，改不了。',[{t:'合上手账',fn:()=>{}}]); return flushEvents();
  }
  const t=c.tokens.find(x=>x.key===key); if(!t) return;
  /* 【第四批 · ②】按 useFor 走独立 UI 分支：forkFlag 枚（C5/C6）写定结果也带题干 +
     提示，明确「这一笔不填进那三句话」；blank 枚返回空串，画面完全不变。 */
  const forkUi = c.keyword.useFor==='forkFlag' ? quizHead(c) : '';
  if(key===c.keyword.key){
    q.state='done'; q.keyword=key;       // Q2 定稿：按 id / key 匹配，无自由输入
    /* 【FAST · 2.5】二周目每完成 1 条 +1，与一周目通道 A 的节奏等价（c2–c6 各 1 次＝5）。
       不需要 c.id!=='c1'：c1 在函数开头就 return tutorialEntry()，走不到这里。
       不需要 S.trust<5 守卫：addTrust() 内部已 Math.min(max,…)。 */
    if(fastOn()) addTrust(1);
    /* 【2.8】日志只写玩家看到的词（t.word），不写 token 的内部 key（形如 c3_a）——
       手账「手账记事」是把 S.log 原样渲染的，写 key 就是把内部 ID 送到玩家眼前。 */
    addLog('写下第 '+c.zone+' 笔的关键词：'+keywordLabel(c,key)+'（已读懂 '+interpretedCount()+' 笔）。');
    pushEvent(`${forkUi}<span class="nm">这一笔，你记下了。</span><br>${esc(tokenText(t))}<br>
      <span class="desc">你写的是：${esc(keywordLabel(c,key))}</span>`,[{t:'记进手账',fn:()=>{}}]);
  } else {
    q.wrong=true;                        // P4：state 停在 pending，禁止改写；不新增第四态
    addLog('第 '+c.zone+' 笔的关键词写错了，这一笔改不了。');
    pushEvent(`${forkUi}<span class="nm">写错了，改不了。</span><br>${esc(tokenText(t))}<br>
      <span class="desc">这一笔不会再算了。</span>`,[{t:'合上手账',fn:()=>{}}]);
  }
  afterChange(); flushEvents();
}

/* 2.7：重读按三态 */
function actReread(z){
  const c=clueByZone(z); if(!c) return;
  const q=clueOf(c.zone);
  if(c.id==='c1' && q.state!=='done'){ return tutorialEntry(); }   // 【C1】未读懂时重读 = 回教学
  if(!q.found){
    pushEvent(`<span class="nm">手账 · 第 ${z} 笔</span><br>这一页还是空的。`,[{t:'合上这一页',fn:()=>{}}]);
    return flushEvents();
  }
  if(q.state==='raw'){
    pushEvent(`<span class="nm">手账 · 第 ${z} 笔 · 已记下</span><br>${esc(c.hook)}<br>
      <span class="desc">记下的是：${esc(c.record)}</span><br>
      <span class="desc">还没问过，只有原句。</span>`,[{t:'合上这一页',fn:()=>{}}]);
    return flushEvents();
  }
  if(q.state==='pending'){
    const opts=q.wrong?[]:c.tokens.map(t=>({t:'就是这句：'+tokenText(t),fn:()=>actWriteKeyword(c.zone,t.key)}));
    if(!opts.length) opts.push({t:'合上这一页',fn:()=>{}});
    /* 【②】重读 forkFlag 枚时同样补提示 + 题干 */
    pushEvent(`<span class="nm">手账 · 第 ${z} 笔 · ${q.wrong?'已写错':'问过了'}</span><br>${quizHead(c)}${esc(fullSentence(c))}
      ${q.wrong?'<br><span class="desc">你写错了，改不了。</span>':'<br><span class="desc">看清整句，再圈出原话写下关键词（写错不可逆）。</span>'}`,opts);
    return flushEvents();
  }
  pushEvent(`<span class="nm">手账 · 第 ${z} 笔 · 已读懂</span><br>${esc(c.hook)}<br>
    <span class="desc">记下的是：${esc(c.record)} ｜ 关键词：${esc(keywordLabel(c,q.keyword))}</span>
    ${q.via==='tutorial'?'<br><span class="desc">'+esc(tutTag(c))+'</span>':''}`,
    [{t:'合上这一页',fn:()=>{}}]);
  flushEvents();
}

/* 【批 3 · 3.5】彩蛋信物赠送：按 A4 规则，常规角色只播咬合台词、不加好感；
   祝颜收车票 trust +1（补到 5）；谢寻旧工牌只给 HE 线索标记。
   调用方负责先播「拿到信物」的叙述，再把赠送选项挂上。 */
function giveItemTo(targetId, item, aff, line, tag, flagKey){
  const L=LOVER_BY[targetId], N=KEY_BY[targetId];
  if(!L && !N) return;
  const name=L?L.name:(N?N.name:targetId);
  /* 常规角色：只播台词、不加好感（A4） */
  if(L && !isSecondRunAffAllowed(targetId)){
    pushEvent(`<span class="nm">${esc(name)}</span><br>${esc(line||'')}`,
      [{t:'记进手账',fn:()=>{}}]);
    return flushEvents();
  }
  /* 谢寻：只给 HE 线索标记，不给好感（A4） */
  if(targetId==='xie_xun' && tag==='xiexun_clue'){
    S.flags=S.flags||{}; if(flagKey) S.flags[flagKey]=true;
    pushEvent(`<span class="nm">${esc(name)}</span><br>${esc(line||'')}`,
      [{t:'记进手账',fn:()=>{}}]);
    return flushEvents();
  }
  /* 祝颜：trust +1，补到 5 为止 */
  if(targetId==='conductor_f'){
    const before=S.trust;
    addTrust(1);
    if(item && item.id){ S.bag[item.id]=0; delete S.bag[item.id]; }
    if(S.trust>before){
      pushEvent(`<span class="nm">${esc(name)}</span><br>${esc(line||'')}`,
        [{t:'记进手账',fn:()=>{}}]);
    } else {
      pushEvent(`<span class="nm">${esc(name)}</span><br>${esc(line||'')}`,
        [{t:'记进手账',fn:()=>{}}]);
    }
    return flushEvents();
  }
  /* 其他：+aff（走好感），用于常规角色但在 A4 下不会命中，保底路径 */
  if(aff>0 && L) S.aff[targetId]=(S.aff[targetId]||0)+aff;
  pushEvent(`<span class="nm">${esc(name)}</span><br>${esc(line||'')}`,
    [{t:'记进手账',fn:()=>{}}]);
  flushEvents();
}
/* A4 规则：二周目常规角色一律不加好感；只有谢寻（二周目可攻略）可以涨。 */
function isSecondRunAffAllowed(targetId){
  return targetId==='xie_xun';   // 谢寻走 HE 线时好感已在陪伴里涨过，信物不加
}

function grannyGrant(r,e){
  if(r.effect==='restore_lost_clue'){
    S.bag[r.label]=(S.bag[r.label]||0)+1;
    pushEvent(`<span class="nm">${esc(e.name)}</span><br>拿去吧。……总有用得上的地方。`,
      [{t:'收下',fn:()=>{}}]);
    return flushEvents();
  }
  if(r.effect==='gift'){
    const targets=Array.isArray(r.targets)?r.targets:['__any__'];
    /* 简化：任意角色礼物 → 弹出角色选择；指定角色 → 直接走 */
    if(r.targets==='any'){
      const cand=activeLovers().filter(L=>L.difficulty!=='meta');
      if(!cand.length){
        S.bag[r.id]=(S.bag[r.id]||0)+1;
        pushEvent(`<span class="desc">（先收进背包，找到合适的人再送。）</span>`,[{t:'知道了',fn:()=>{}}]);
        return flushEvents();
      }
      pushEvent(`<span class="nm">${esc(e.name)}</span><br>给谁？`,
        cand.map(L=>({t:esc(L.name),fn:()=>{
          S.bag[r.id]=(S.bag[r.id]||0)+1;
          giveItemTo(L.id,{id:r.id,label:r.label},1,r.line);
        }})));
      return flushEvents();
    }
    /* 指定角色 → 弹角色选择 */
    pushEvent(`<span class="nm">${esc(e.name)}</span><br>给谁？`,
      targets.filter(id=>LOVER_BY[id]).map(id=>({t:esc(LOVER_BY[id].name),fn:()=>{
        S.bag[r.id]=(S.bag[r.id]||0)+1;
        const line=(r.lines||{})[id]||'';
        giveItemTo(id,{id:r.id,label:r.label},r.aff||0,line);
      }})));
    return flushEvents();
  }
  /* 其他奖励类型（旁注等） */
  if(r.effect==='note'){
    pushJournalNote({source:e.id,zone:S.zone,text:r.text});
    pushEvent(`<span class="desc">${esc(r.text)}</span>`,[{t:'记进手账',fn:()=>{}}]);
    return flushEvents();
  }
}

function useFragment(){
  if((S.bag['旧手账残页']||0)<=0) return;
  const lost=CLUES.filter(c=>{
    const q=S.clue[c.zone];
    return q && !q.found;

      [{t:'知道了',fn:()=>{}}]);

  }
  pushEvent('<span class="nm">残页</span><br>要补记哪一条？',
    lost.map(c=>({t:esc(c.record),fn:()=>{
      S.bag['旧手账残页']--;
      if(S.bag['旧手账残页']<=0) delete S.bag['旧手账残页'];
      const q=clueOf(c.zone);
      q.found=true; q.state='raw'; q.via='fragment';

  /* 【二周目第二批】总池模型下跨区间不补点；一周目仍按区间表重置，行为逐字不变。 */
  if(!S.srPool) S.actionsLeft=CFG.actionsPerZone[S.zone-1];

     发现「点没回来」。复用现有 #toast，不新增 DOM；标记写 S.flags，只弹一次。 */
  if(S.srPool && S.zone===2 && !(S.flags&&S.flags.actionPoolTipShown)){

     zone6 第 6 枚在「主线」页可点，0 行动点；【第三批】终局读它的 state 作第 5/6 枚判定。 */
  if(S.zone>=CFG.zones){
    /* 【2026-11-06 C6 时序修复 · 方向 1】到站不再同一帧弹终局问答。
       旧版这里直接 showFinale()：模态遮罩一拉起，问答 → 判定 → 分岔台 → 结局
       整条事件队列里 mask 都不关，玩家没有任何窗口切回主线页点第 6 枚热点，
       c6 永远停在 found=false / state='raw'（zone6 行动点 0、两处 cost 0、
       via 只有 conductor_f，数据层其实全给它开了绿灯，卡的是时序不是条件）。
       现在只 afterChange()，S.finaleStarted 保持 false；问答入口交给

       点「主线」做 C6、点「车厢」即回到分岔口页答题。 */
    addLog('列车停在分岔口。你翻开手账。');

  }
  addLog('列车驶入第 '+S.zone+' 区间。');

  maybeTriggerXieXunPhoto();      // 【批 1 · 3.4】进区后若已达旧照片条件（zone4+ / 好感≥12 / 未触发）则自动续播

/* ── 【批 1 · 3.4 / 3.5】谢寻旧照片深度事件 + HE 线索计数 ───────────────────────
   旧照片事件：zone4+ 且好感 ≥ deepEventData.affRequired（12）且本局未触发过，自动续播

function xiexunClueCount(){
  /* 【2026-11-07 批 3 · 3.12】谢寻 HE 线索池计数（flag 版）：
     - laofengDialogDone：老冯二周目对话（批 1 落库）
     - eggChildBadge：雾里小孩旧工牌（批 3）
     - eggOldConductorPage：另一个列车员巡检本残页（批 3）
     - zhuyanHighTrustLine：祝颜高档台词（批 2 落库时若未挂此 flag 则此条不计数，不阻断）
     - legacyRecordFragment：手账旧记录碎片（批 4 已实装：acquireOldRecord() 集齐 3 条置位）
     - xiexunPhotoDone：旧照片（批 1）
     凑齐 requiredClueCount（默认 3）条即可触发谢寻 HE。 */
  let n=0;
  if(S.flags.laofengDialogDone) n++;
  if(S.flags.eggChildBadge) n++;
  if(S.flags.eggOldConductorPage) n++;
  if(S.flags.zhuyanHighTrustLine) n++;

}
function maybeTriggerXieXunPhoto(){
  if(!isSecondRun()) return;
  const L=LOVER_BY['xie_xun']; if(!L||!L.secondRun||!L.secondRun.deepEventData) return;
  const d=L.secondRun.deepEventData;
  S.flags=S.flags||{};
  if(S.flags[d.setFlag]) return;                          // 本局只触发一次
  if(S.zone < (d.zone||4)) return;
  if((S.aff['xie_xun']||0) < (d.affRequired||12)) return;
  playXieXunPhotoEvent(L,d);
  flushEvents();                                         // 队列有未关弹窗时自动跳过，旧窗关闭后由事件委托续播
}
function playXieXunPhotoEvent(L,d){
  const steps=d.steps||[]; let i=0;
  let log=`<div class="desc">${esc(d.scene)}</div>`;
  /* 入口即写 once 守卫 + 线索 tag：即便事件含 choice 步骤需玩家点击才收尾，
     xiexunPhotoDone 也必须即时置位，避免下一区间重复触发；heTrigger.cluePool 同步登记。 */
  S.flags[d.setFlag]=true;
  S.clueTags=S.clueTags||{};
  S.clueTags[d.id]=true;                                   // 事件 id（"xiexun_photo"）也登记，对齐 heTrigger.cluePool
  if(d.grantsClue&&d.grantsClue.tag) S.clueTags[d.grantsClue.tag]=true;
  function step(){
    while(i<steps.length){
      const s=steps[i++];
      if(s.type==='choice'){
        const opts=(s.options||[]).map(o=>({t:esc(o),fn:()=>step()}));
        pushEvent(log,opts); return;
      }
      const who = s.speaker==='xie_xun' ? L.name
                : (KEY_BY[s.speaker] ? KEY_BY[s.speaker].name : (s.speaker||''));
      log += `<br><span class="nm">${esc(who)}</span><br>${esc(s.text)}`
           + (s.note?`<br><span class="desc">${esc(s.note)}</span>`:'');
    }
    /* 收尾：手账旁注 + 记日志（只改 S，不写 M）。flag / 线索 tag 已在入口置位。 */
    if(d.grantsClue&&d.grantsClue.text) pushJournalNote({source:d.grantsClue.source||d.id,zone:S.zone,text:d.grantsClue.text});
    if(d.journalNote) pushJournalNote({source:d.id,zone:S.zone,text:d.journalNote});
    addLog('谢寻的旧照片：'+(d.grantsClue&&d.grantsClue.text||'')+'（已记入手账）');
    pushEvent(log,[{t:'记下这一刻',fn:()=>{}}]);
  }
  step();
}

/* 【2026-11-07 批 4 · 3.3】获得旧记录：按 id 从 secondRun.oldRecords.entries 取，不重复。
   触发点：zone1 进区（谢寻八年）/ 首次通道 A 解读（祝颜看雾）/ zone3 进区（钟停着）。
   内部幂等 + isSecondRun() 门禁：一周目直接 return，重复调用不重复加。 */
function acquireOldRecord(id){

function getGenericEnding(name){

/* ---------- 【第三批 A】三空选词 ----------
   Q3 定稿·口径 C：三空对错定 BE / 放行；五枚 done 单独定「完整 / 不完整」档。
   【第四批 · 乙】M1 的「候选只用圈过的原话片段」约束已由嘟嘟拍板覆盖：每空固定 5 个手写候选
            （1 正确 + 4 固定干扰），五句都能读进题干、各有干扰逻辑；正确项 label＝tokens[].word。
   M7：第 3 枚 distractor 仍不计入完整档；【乙】其 token 不再作错误候选进池。
   【B3 三档语义不变】done → 5 项正常给（含正确词）；raw / missed → 用 spareDecoy 顶替正确项
            原来的位置，其余 4 条不动。仍是 5 个、位置与画风完全一致、不提示「你漏了」。
   【B2】sanityCheck 的 I2 逐档体检候选池 ≥5 且正确词只在 done 档；blankPool() 为共用纯函数。
   M8：问答阶段不设 escape / 第四出口，R5 只在分岔台出现。 */
const FIN = STORY.mainline.clueScaffold.finale;
const FUI = FIN.uiTexts || {};
function finText(k,fb){ return pendingText(FUI[k],fb); }
/* 【2026-11-07 二周目总池提示】uiTexts.actionPool 取值口。
   与 finText 一样走 pendingText()：字段缺失 / 仍是【待写】占位时返回空串，
   调用方自行跳过渲染，不让空串或占位串上屏。poolIntro 的 {n} 由 actionTotal() 插值，
   分母单一来源、不写死 10（CFG.actionsSecondRun 改值也自动跟随）。 */
function apText(k){ return pendingText((FUI.actionPool||{})[k],''); }
function poolIntroText(){
  const raw=apText('poolIntro');
  return raw ? raw.replace(/\{n\}/g, actionTotal()) : '';
}
/* 【2026-11-06 C6 引导提示 · 方向 A】对象型 uiTexts 字段的取值口。
   finText() 走 pendingText()，只放行字符串；c6GuideTip 是 {text,hint,dismissible} 对象，
   直接 finText('c6GuideTip',null) 会拿到 null、再读 .text 就抛错。
   这里单独取：字段缺失 / 仍是【待写】占位 / 结构不符 → 返回 null，调用方不渲染、不报错。
   文案仍只存 JSON，引擎不硬编码；dismissible 由数据层保留，本轮不实现关闭交互。 */
function finTip(k){
  const o=FUI[k];
  if(!o||typeof o!=='object'||Array.isArray(o)) return null;
  const text=pendingText(o.text,null), hint=pendingText(o.hint,null);
  return (text||hint)?{text:text||'',hint:hint||''}:null;
}
function forkText(k,fb){ return pendingText((FUI.forkTexts||{})[k],fb); }
function clueById(id){ return CLUES.find(c=>c.id===id)||null; }
/* 第 5/6 枚是否都 done：第三块牌 /【与雾同行】的解锁读单枚 state，不挂 trust（Q1③） */
function forkFlagsDone(){
  const r=(STORY.mainline.clueScaffold.fork||{}).requireClues||['c5','c6'];
  return r.every(id=>{ const c=clueById(id); return c && clueOf(c.zone).state==='done'; });
}
/* M7 完整档：blank 三枚 + 第 5/6 枚共 5 枚 done，第 3 枚 distractor 不计入 */
function fullRunDone(){
  const req=(STORY.mainline.clueScaffold.completeness||{}).requiredClueIds||['c1','c2','c4','c5','c6'];
  return req.every(id=>{ const c=clueById(id); return c && clueOf(c.zone).state==='done'; });
}
/* 【B3 语义不变 · 第四批「乙」只换候选来源】
     done         → 该空 options 的 5 项（正确项 key＝answerToken + 4 条固定干扰），正常选；
     raw / missed → 把正确项「原位置」换成 spareDecoy，其余 4 条固定干扰不动：
                    仍是 5 个、位置一致、画风一致，正确词绝不进池、不给任何提示。
   五句都能读进题干；「想不起来了」弃答选项已删；该空答错＝ incompleteMarks 降档，不直接进 BE。
   判定链仍按 answerToken 比对（judgeFinale / incompleteMarks / BE 一行未动）。
   纯函数只从 STORY 取数、不引用 FIN/FUI（下方定义、启动期有 TDZ），
   sanityCheck() 与运行时共用同一套算法。 */
function blankPool(b, mode){
  const fin=STORY.mainline.clueScaffold.finale, n=fin.candidateCount||5;
  /* 【乙】手写候选表：顺序＝options 数组顺序（确定性、可复现） */
  if(b.options && b.options.length){
    if(mode==='done') return b.options.map(o=>o.key).slice(0,n);
    const spare=b.spareDecoy&&b.spareDecoy.key;
    return b.options.map(o=>o.key===b.answerToken?spare:o.key).filter(Boolean);
  }
  /* legacy 兜底：某空缺 options 才走旧算法（此时才可能触及已 deprecated 的 genericDecoys） */
  const c=clueById(b.clueId), right=b.answerToken, fui=fin.uiTexts||{};
  let own=[], borrowed=[], generic=[];
  if(mode!=='missed') own=c.tokens.map(t=>t.key).filter(k=>k!==right);
  (b.decoyFrom||[]).filter(id=>id!==b.clueId).forEach(id=>{
    const x=clueById(id); if(x) borrowed=borrowed.concat(x.tokens.map(t=>t.key));
  });
  (fui.genericDecoys||[]).forEach(g=>generic.push(g.key));
  const uniq=a=>a.filter((k,i)=>a.indexOf(k)===i && k!==right);
  const wrong = mode==='missed' ? uniq(borrowed.concat(generic)) : uniq(own.concat(borrowed,generic));
  const pool = mode==='done' ? [right].concat(wrong.slice(0,n-1)) : wrong.slice(0,n);
  return pool.sort();
}
function blankCandidates(b){
  const q=clueOf(clueById(b.clueId).zone);
  return blankPool(b, q.state==='done' ? 'done' : (q.found ? 'raw' : 'missed'));
}
function candidateText(key){
  /* 【第四批 · 乙】候选文案优先读 blanks[].options[].label（嘟嘟定稿总表）：
     正确项 label 与 tokens[].word 逐字一致，干扰项来自总表手写词；
     raw / missed 档的补位词读 spareDecoy.label。 */
  const fin=STORY.mainline.clueScaffold.finale;
  for(const b of (fin.blanks||[])){
    const o=(b.options||[]).find(x=>x.key===key); if(o) return o.label;
    if(b.spareDecoy&&b.spareDecoy.key===key) return b.spareDecoy.label;
  }
  const t=CLUES.reduce((a,c)=>a.concat(c.tokens),[]).find(x=>x.key===key);
  if(t) return tokenText(t);                 // legacy 兜底（无 options 的旧档）
  const g=((fin.uiTexts||{}).genericDecoys||[]).find(x=>x.key===key);
  return pendingText(g&&g.text,'（通用候选待写 · '+key+'）');
}
/* 【收束】把「题干 + 玩家填的选项 label」拼成完整句。
   题干里的 ____ 替换成 candidateText(ansKey)；找不到占位时退回 label 本身。 */
function fullSentenceFromBlank(b, ansKey){
  const p=String((b&&b.prompt)||'');
  const ans=candidateText(ansKey)||'';
  if(p.indexOf('____')>=0) return p.replace('____', ans);
  return ans;
}
/* 【B1 确认】逐空只收集 S.finaleAnswers，三空答完才进 judgeFinale() 统一判定；
   第一空答错绝不直接 BE（Q3 口径 C：BE 只看总答对空数 ≤1）。
   pushEvent 只入队，由全局事件委托统一 flushEvents，勿在此重复 flush。 */
function askBlank(i){
  const b=FIN.blanks[i];
  if(!b) return judgeFinale();
  const head=`<span class="nm">第 ${i+1} 空</span><br>${esc(finText('blankAsk',CFG.finale.blankIntro))}<br>`
    + `<span class="desc">${esc(pendingText(b.prompt,'（题干待写）'))}</span>`;
  // 线索候选一律不传 hint / disabled / 状态提示（B3：三档画风完全一致，不提示「你漏了」）
  const opts=blankCandidates(b).map(k=>({
    t:esc(candidateText(k)),
    fn:()=>{
      S.finaleAnswers[i]=k;
      /* B3：该空答错 → incompleteMarks 置位 → 完整档降为不完整，但不直接 BE。 */
      S.incompleteMarks[i]=(k!==b.answerToken);
      afterChange(); askBlank(i+1);
    }
  }));
  pushEvent(head,opts);   // 「想不起来了」弃答选项已删（B3）
}
/* 【收束】三空放行后，先播祝颜确认，再进分岔台。
   只念填对的空（题干+玩家填的词拼成完整句），每句后补一句白话。
   对2空时按 incompleteMarks 第一个 true 的下标取 partialNoteByBlank[blankN] 点名差哪一空；
   找不到匹配时回退 partialNoteDefault。
   全部播完调 callback 进分岔台。非二周目也播——一周目同样需要收束。 */
function showVerdictConfirm(callback){
  const vc=FUI.verdictConfirm;
  if(!vc || !Array.isArray(vc.lines) || !vc.lines.length){ if(callback) callback(); return; }
  const rightCount=FIN.blanks.filter(b=>S.finaleAnswers[b.index]===b.answerToken).length;
  const items=[];
  vc.lines.forEach((line,i)=>{
    const b=FIN.blanks[i];
    if(!b) return;
    if(S.finaleAnswers[b.index]!==b.answerToken) return;   // 只念填对的空
    const ansKey=S.finaleAnswers[b.index];
    const quote=(typeof line.quote==='string' && line.quote.trim())
      ? line.quote
      : fullSentenceFromBlank(b, ansKey);
    items.push(`<span class="nm">祝颜</span><br>「${esc(quote)}」<br>`
      + (line.plain ? `<span class="desc">${esc(line.plain)}</span><br>` : ''));
  });
  if(rightCount<3){
    const missIdx=(Array.isArray(S.incompleteMarks)?S.incompleteMarks:[]).indexOf(true);
    const byBlank=(vc.partialNoteByBlank||{});
    const pn=byBlank['blank'+missIdx] || vc.partialNoteDefault || '';
    if(pn) items.push(`<span class="desc">${esc(pn)}</span>`);
  }
  const closing = (rightCount>=3) ? (vc.closingFull||'') : (vc.closingPartial||'');
  if(closing) items.push(`<span class="nm">祝颜</span><br>${esc(closing)}`);
  if(!items.length){ if(callback) callback(); return; }
  pushEvent(items.join('<br>'),[{t:'……',fn:()=>{ if(callback) callback(); }}]);
  flushEvents();
}
function judgeFinale(){
  const right=FIN.blanks.filter(b=>S.finaleAnswers[b.index]===b.answerToken).length;
  if(right<=1){                       // ≤1 空 → BE【雾中迷失】
    S.mainlinePassed=false; S.finaleChoice='melt';
    resolveBE('雾中迷失'); return;   // resolveBE 只 pushEvent，委托统一 flush
  }
  S.mainlinePassed=true;
  /* 【B3】判定链分离：BE 只看答对空数（上面 right<=1）；降档只看 incompleteMarks。
     两者不混 —— 完整档 = 三空都没答错 + 五枚 done（M7）。 */
  S.completeRun=(!S.incompleteMarks.some(Boolean) && fullRunDone());
  S.shortSolo=(right===2);
  const verdict=S.completeRun?'verdictFull':(S.shortSolo?'verdictTwo':'verdictPartial');
  const fb=S.completeRun?'你把三空连成了一句话。':(S.shortSolo?'你连上了两空。':'你连上了三空，但手账里还有没读懂的笔。');
  pushEvent(`<span class="nm">${esc(finText(verdict,fb))}</span>`,
    [{t:'抬头看向站牌',fn:()=>showVerdictConfirm(()=>showFork())}]);
}
function showFinale(force){
  if(S.endId) return;
  if(S.finaleStarted && !force) return;   // 读档回到未答完的终局：按钮可强制重开
  S.finaleStarted=true;
  /* 【第三批 / Q3 定稿】n<minClues 的前置 BE 已删：记下多少笔都不再直接判死。 */
  S.finaleAnswers=[null,null,null]; S.incompleteMarks=[false,false,false];
  S.completeRun=false; S.shortSolo=false;
  /* 【2026-11-07 批 4 · 3.7】二周目 + M.glimpse 时，开场白之后给两个选项：
     「看一眼残页」展开残页提示（不阻断答题）；「翻开手账，试着填空」直接进第一空。
     残页只展开一次，S.flags.fragmentShown 标记；展开后重开开场，按钮消失、开场白追加残页文本。
     若玩家第一次没点「看一眼残页」直接填空 → 残页永不展开（玩家自己决定要不要看提示）。
     不实现 3.8（每空顶部重复展示），只在开场白显示一次。 */
  S.flags=S.flags||{};
  const frag=FUI.secondRunAnswerFragment||{};
  const canShowFrag=isGlimpseActive() && pendingText(frag.text,'');
  const opts=[];
  if(canShowFrag && !S.flags.fragmentShown){
    opts.push({t:'看一眼残页',fn:()=>{
      S.flags.fragmentShown=true;
      afterChange();
      showFinale(true);   // 重开开场，此时「看一眼残页」已不显示，只剩「翻开手账」+ 残页内容
    }});
  }
  opts.push({t:'翻开手账，试着填空',fn:()=>askBlank(0)});
  const fragTip = (canShowFrag && S.flags.fragmentShown) ? `<br><br><span class="desc">${esc(frag.hint||'')}</span><br><span class="desc" style="opacity:.7">${esc(frag.text||'')}</span>` : '';
  pushEvent(`<span class="nm">${esc(CFG.finale.opener)}</span><br>
    <span class="desc">${esc(CFG.finale.ask)}　（记下 ${clueCount()} 笔 / 读懂 ${interpretedCount()} 笔）</span>${fragTip}`,
    opts);
  flushEvents();   // 入口由 nextZone 直接调用，必须自己 flush
}

/* ---------- 【第三批 B】分岔台 ----------
   仍列出「所有搭过话的人」（P2-12，不退回系统替玩家选对象）。
   灰选项两档（Q1 三个小的②）：好感 ≥20 可点；<20 disabled + 分岔台可给提示。
   二次确认：写 S.finaleChoice 之前先确认，选「再想想」回分岔台、不消耗抉择。
   第 5/6 枚：读单枚 state==='done'（Q1③ / P3 不加数值门槛）；首周目只给钩子，不消耗抉择。
   M8：R5「合上手账，不下车」是独立选项，不复用问答阶段 escape。
   【2026-11-06 结局合并】stay 选项删除；一屏「不下车」= together（双人，结局名「心意未定」）
            + refuse_leave（单人，结局名「不选之选」），共 2 项。
   只 pushEvent，由全局事件委托统一 flushEvents。 */
function confirmFork(choice,L,label){
  pushEvent(`<span class="nm">${esc(forkText('confirm','这一下车，就不再改了。'))}</span><br>
    <span class="desc">${esc(label)}</span>`,[
    {t:esc(forkText('confirmYes','确定')),fn:()=>{
      S.finaleChoice=choice;                       // 二次确认之后才写
      resolveEnding(choice,L);
    }},
    {t:esc(forkText('confirmNo','再想想')),fn:()=>showFork()}
  ]);
}
/* 【2026-11-07 批 2】「留下」的 trust 软门槛：
   - trust ≥ trustDirectThreshold（3）：走正常 confirmFork 二次确认 → resolveEnding 里播 directText → 进结局
   - trust ≤ trustHesitateThreshold（2）：先播犹豫对话，玩家二选一：
       · 「我确定」→ 设 alongWithFogHesitated → resolveEnding 里跳过 directText → 进结局
       · 「……我再想想」→ 设 alongWithFogDeclined → 播 declineText → 退回分岔台，「留下」本趟消失
   无配置 / 非二周目：退回原 confirmFork 路径，行为与改动前一致。 */
function tryAlongWithFog(label){
  const sg=(FIN||{}).alongWithFogSoftGate||(STORY.mainline.clueScaffold.finale||{}).alongWithFogSoftGate;
  if(!sg || !isSecondRun() || S.trust>=sg.trustDirectThreshold){
    return confirmFork('along_with_fog',null,label);   // 无配置 / 非二周目 / trust 够：原路径
  }
  /* trust ≤ trustHesitateThreshold：犹豫对话，不走 confirmFork（避免两次确认叠加） */
  const hesitate=nl2br(pendingText(sg.hesitateText,'……'));
  pushEvent(hesitate,[
    {t:'我确定。',fn:()=>{
      S.flags=S.flags||{}; S.flags.alongWithFogHesitated=true;
      S.finaleChoice='along_with_fog';
      resolveEnding('along_with_fog',null);
    }},
    {t:'……我再想想。',fn:()=>{
      S.flags=S.flags||{}; S.flags.alongWithFogDeclined=true;
      const decline=nl2br(pendingText(sg.declineText,'她点了点头，没说什么。'));
      pushEvent(decline,[{t:'知道了',fn:()=>showFork()}]);
      flushEvents();
    }}
  ]);
  flushEvents();
}
function showFork(){
  /* 谢寻 HE 资格：**单一计算点**（全库只此一处）。下方 if(xieEligible)、「留下」并列说明

  met.forEach(L=>{
    const a=S.aff[L.id]||0, label=labelWith.replace('{name}',L.name);

  /* 【2026-11-06 结局合并 · 3.1】「继续坐着」(stay / sit_still) 选项整条删除。
     labelSitStill 已从 forkTexts 移除，fork.sitStill 数据条目也已删；

  // 第 5/6 枚判定：isGlimpseActive() + c5.done + c6.done → 主动抉择；否则首周目钩子（可返回）
  /* 【Bug 2 · 2.3 方式 2（推荐）】谢寻 HE 与【与雾同行】改为「两个都列、选了一个本趟消失」：

     现在并列：两者都是终局选项，选任意一个本趟立即结算结束，另一个自然不可能再被选；
     谢寻 HE 结算写 S.flags.xiexunHEChosen、留下结算走 resolveEnding('along_with_fog')，

  if(xieEligible){

  if(isGlimpseActive() && forkFlagsDone() && !S.flags.alongWithFogDeclined){

    const cnt=(S.flags&&Number.isFinite(S.flags.thirdSignCount))?S.flags.thirdSignCount:0;

    + ((isSecondRun() && !isGlimpseActive())

/* 【第三批 / Q3】≤1 空答对 → BE【雾中迷失】，且锁死所有同行。
   M8：问答阶段 escape 已删；R5「合上手账」走 refuse_leave 独立结局，
   不再复用这里（本函数会把 mainlinePassed 写成 false）。kind 保留只为兼容调用点。 */
function resolveBE(kind){
