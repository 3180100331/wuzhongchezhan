  const name='BE · 雾中迷失', text=getGenericEnding('雾中迷失');
  setEnding('雾中迷失',name,text);   // id 显式传新键；name 仍是 'BE · 雾中迷失' 标题
  pushEvent(`<div class="end-title">${esc(name)}</div>${esc(text)}<br><span class="desc">（主线未通关：这一趟，你没法和任何人同行。）</span>`,[{t:'列车重新开动',fn:()=>{}}]);
}

function resolveEnding(choice,L){
  let end;
  const maxAff=Math.max(0,...activeLovers().map(x=>S.aff[x.id]||0));
  if(choice==='with' && L){
    // 通关主线后，选谁同行由玩家定；没走到最后就播这位角色自己的到站告别
    if(reached(L) && S.deep[L.id]) end=heOf(L);
    else if(reached(L)||(S.aff[L.id]||0)>=20) end=beOf(L);
    else end={id:'心意未定·'+L.name,name:'心意未定',text:getGenericEnding('心意未定')};
  }
  /* 【批 1 · 3.5 / 3.6】谢寻 HE：玩家在分岔台主动说出 keyLine（heTrigger.keyLine）即达成。
     走 heOf(xie_xun)，并把 keyLine 作为「你」的台词前置展示；写 S.flags.xiexunHEChosen 防重复触发。 */
  else if(choice==='xiexun_he' && L && L.id==='xie_xun'){
    S.flags=S.flags||{}; S.flags.xiexunHEChosen=true;
    const keyLine=(L.secondRun&&L.secondRun.heTrigger&&L.secondRun.heTrigger.keyLine)||'';
    end={id:'HE·谢寻',name:L.he.name,text:L.he.text,line:L.he.line,who:L.name,playerLine:keyLine};
  }
  /* 【结局合并 · 3.2】together：id 保持 '同路而行' 不变；结局名读 endingNameTogether「心意未定」，
     正文从 forkTexts.togetherText 单一来源取（ENDINGS['同路而行'] 为逐字同源回退）。
     不写 M.glimpse、不吞角色结局。 */
  else if(choice==='together'){
    end={id:'同路而行',name:forkText('endingNameTogether','心意未定'),
         text:forkText('togetherText',ENDINGS['同路而行'])};
  }
  /* 【2026-11-06 删除】原 choice==='stay'「继续坐着 / 心意未定」单人中性结局整条移除。 */
  else if(choice==='alone'){
    /* 【2026-11-07 A2】alone 合并为两档：<20 独行（写 M.glimpse）/ >=20 留白（不写）。
       删中间地带『心意未定』分支，撞名问题消失；留白同时作 else 兜底，语义都是「没有明确归宿」。
       Q3 补漏：「短一段」只替换【雾的真相·独行】这一篇正文，不强制独行，结局仍由分岔台选择决定。 */
    if(maxAff<20) end={id:'雾的真相·独行',name:'雾的真相 · 独行',
                       text:S.shortSolo?finText('soloShort',getGenericEnding('独行')):getGenericEnding('独行'),glimpse:true};
    else          end={id:'留白',name:'留白',text:getGenericEnding('留白')};
  }
  /* 【第三批 B / M8】R5 单独结局：mainlinePassed 保持 true，不复用 resolveBE('逃避')。
     【结局合并 · 3.2】结局名读 endingNameRefuseLeave「不选之选」，正文为软化版
     forkTexts.refuseLeaveText（ENDINGS['不选之选'] 逐字同源回退）；id 不变、不写 M.glimpse。 */
  else if(choice==='refuse_leave'){
    end={id:'refuse_leave',name:forkText('endingNameRefuseLeave','不选之选'),
         text:forkText('refuseLeaveText',ENDINGS['不选之选'])};
  }
  /* 【批 2 · 3.6】第 6 区间主动抉择，【与雾同行】入口。
     goAlong 必定同步执行（与批 1 行为一致：直接结算结局 + 推谢寻 BE 收尾），保证
     resolveEnding 调用即完整结算，不依赖后续点击（避免直接调用时结局未写入）。
     二周目且未犹豫（trust ≥ 3 直进）时，先播一段 directText 引子（点「……」继续即见结局）；
     一周目 / 犹豫路径（alongWithFogHesitated）/ 无配置：不播引子，直接 goAlong。
     其余分支（with / together / alone / refuse_leave）一行未动；本分支 return 跳过函数末尾的 setEnding。 */
  else if(choice==='along_with_fog'){
    const sg=(FIN||{}).alongWithFogSoftGate||{};
    const goAlong=()=>{
      const e={id:'与雾同行',name:'与雾同行',text:forkText('alongWithFogText','……')};
      setEnding(e.id,e.name,e.text);
      pushEvent(`<div class="end-title">${esc(e.name)}</div>`+nl2br(e.text),
        [{t:'列车到站',fn:()=>{}}]);
      /* 【批 1 · 3.6】「选留下」→ 谢寻被留在雾里，给一段 BE 叙事收尾（本批保留，不碰谢寻线）。 */
      if(isSecondRun() && (S.aff['xie_xun']||0)>0 && !S.flags.xiexunHEChosen){
        const X=LOVER_BY['xie_xun'];
        if(X&&X.be) pushEvent(`<div class="end-title">谢寻 · ${esc(X.be.name)}</div>${esc(X.be.text)}<br><span class="nm">「${esc(X.be.line)}」</span>`,
          [{t:'……',fn:()=>{}}]);
      }
      flushEvents();
    };
    /* 二周目非犹豫直进：先排 directText 引子，再同步结算 goAlong（引子之后即见结局 + BE）。 */
    if(isSecondRun() && !S.flags.alongWithFogHesitated && sg && sg.directText){
      const direct=nl2br(pendingText(sg.directText,''));
      pushEvent(direct,[{t:'……',fn:()=>{}}]);   // 引子：点「……」继续，goAlong 已同步入队
      goAlong();
      return;   // 已自行结算，不落到函数末尾的 setEnding
    }
    return goAlong();
  }
  else { end={id:'留白',name:'留白',text:getGenericEnding('留白')}; }
  setEnding(end.id,end.name,end.text,end.glimpse,end.line,end.who);
  pushEvent(`<div class="end-title">${esc(end.name)}</div>`
    + (end.playerLine?`<span class="nm">你</span><br>${esc(end.playerLine)}<br><br>`:'')
    + (end.who?`<span class="desc">${esc(end.who)} · 到站</span><br>`:'')
    + nl2br(end.text)
    + (end.line?`<br><span class="nm">「${esc(end.line)}」</span>`:''),
    [{t:'列车到站',fn:()=>{}}]);
  /* 【批 1 · 3.6】「选留下」（与雾同行 / 合上手账不下车）→ 谢寻被留在雾里，给一段 BE 叙事收尾。
     仅 pushEvent、不走 setEnding（不写 M、不叠加结局计数）。已走谢寻 HE 的不再重复。 */
  if(isSecondRun() && (choice==='along_with_fog'||choice==='refuse_leave') && (S.aff['xie_xun']||0)>0 && !S.flags.xiexunHEChosen){
    const X=LOVER_BY['xie_xun'];
    if(X&&X.be) pushEvent(`<div class="end-title">谢寻 · ${esc(X.be.name)}</div>${esc(X.be.text)}<br><span class="nm">「${esc(X.be.line)}」</span>`,
      [{t:'……',fn:()=>{}}]);
  }
}
/* 角色专属结局：名字、正文、到站台词全部取自 STORY（step2-story-data.json）。
   引擎过去写死的「双向奔赴 · X」和通用「遗憾」串已退休。 */
function heOf(L){ return {id:'HE·'+L.name,name:L.he.name,text:L.he.text,line:L.he.line,who:L.name}; }
function beOf(L){ return {id:'BE·'+L.name,name:L.be.name,text:L.be.text,line:L.be.line,who:L.name}; }

/* M 只在结局结算时写一次 */
function setEnding(id,name,text,glimpse,line,who){
  S.endId=id; S.endName=name; S.endText=text; S.endLine=line||''; S.endWho=who||''; S.tab='ending';
  M.playCount++;                                   // 语义不变：每次结局都 +1
  /* 【2026-11-07 批 B′】M.completedRuns 只在第 2 趟（一局走完）结算时 +1，
     记「完成了几局」，与 playCount 的「通关次数」语义分开。 */
  if(S.runIndex === 2) M.completedRuns=(M.completedRuns||0)+1;
  if(glimpse) M.glimpse=true;
  M.endings[id]=(M.endings[id]||0)+1;
  saveMeta(M);
}

/* ---------- ⑦ 事件弹窗队列 ---------- */
let eventQueue=[];
function pushEvent(text,opts){ eventQueue.push({text,opts:opts||[{t:'知道了'}]}); }
function flushEvents(){
  if($('mask').classList.contains('show')) return;
  const e=eventQueue.shift(); if(!e) return;
  $('sheet')._opts=e.opts;
  /* 【第三批 B / 清单补漏】渲染层必须真的输出 disabled 属性：光在 showFork 里跳过绑定不够，
     按钮要不可点（全局事件委托另有 t.disabled 兜底）。
     【2026-11-06 短句上屏】o.hint 现在两处用：① 分岔台灰选项的不可选提示；
     ② 通道 B 选人面板的「你注意到的事」短句（cand.map 传 hint，文本取自 channelBPanel）。
     线索圈词 / 写关键词等其余按钮仍一律不传 hint，不提示「你漏了」——适用范围不一刀切。
     注意 o.hint 为假值时 <small> 不渲染：当前 5 位 LOVERS 全有 note，不会触发。 */
  $('sheet').innerHTML=`<div class="st">${e.text}</div>`+e.opts.map((o,i)=>
    `<button class="btn${(o.disabled||o.ghost)?' ghost':''}" data-opt="${i}"${o.disabled?' disabled':''}>${o.t}${o.hint?`<small>${o.hint}</small>`:''}</button>`).join('');
  $('mask').classList.add('show');
}

/* ---------- ⑧ 存档 ---------- */
const PREFIX='fog5_';
/* 【批 5 · 多槽存档】槽位元数据：自动槽与手动槽共用一张表，键是槽位 id（auto / 1 / 2 / 3）。
   只存**显示用的轻量字段**，不存 S 全量——卡片渲染只读这张表、不解析存档正文，
   所以没有 meta 的旧档（fog5_auto / fog5_1）也能正常进页面，显示「刚开局」、下次保存后补齐。
   location 存 S.location 或 null：地点表要等地点分区批次才落地，这里不预写假默认值。 */
function readSlotMeta(){
  try{ return JSON.parse(localStorage.getItem(CFG.saves.metaKey)||'{}'); }
  catch(e){ return {}; }
}
/* 槽位里有没有存档正文：卡片判「有档 / 空槽」用这个，而不是只看 meta。
   旧档可能只有 fog5_1、没有 slotmeta，那时仍要能读，只是显示「刚开局 / 时间未知」。 */
function hasSlot(slot){
  try{ return !!localStorage.getItem(PREFIX+slot); }catch(e){ return false; }
}
function writeSlotMeta(slot){
  const all=readSlotMeta();
  const topAff=Object.entries(S.aff||{}).sort((a,b)=>b[1]-a[1])[0];
  all[slot]={
    savedAt: Date.now(),
    runIndex: S.runIndex||1,
    zone: S.zone,
    location: S.location||null,
    endName: S.endName||null,
    topAff: topAff ? {id:topAff[0], name:(LOVER_BY[topAff[0]]||{}).name||topAff[0], value:topAff[1]} : null
  };
  try{ localStorage.setItem(CFG.saves.metaKey, JSON.stringify(all)); }catch(e){}
}
function removeSlotMeta(slot){
  const all=readSlotMeta(); delete all[slot];
  try{ localStorage.setItem(CFG.saves.metaKey, JSON.stringify(all)); }catch(e){}
}
function saveGame(slot){
  try{
    localStorage.setItem(PREFIX+slot, JSON.stringify(S));
    writeSlotMeta(slot);
  }catch(e){}
}
function deleteSlot(slot){
  try{ localStorage.removeItem(PREFIX+slot); removeSlotMeta(slot); }catch(e){}
}
/* 【2.1 / H2】存档兼容：不用 Object.assign 浅合并（会把新的 clue 对象覆盖成旧布尔）。
   显式搬字段 + 显式遍历 6 个 zone 重建 S.clue：旧 true → done + 该枚默认 key；
   旧 false / 缺失 → raw。映射成 done 是唯一不惩罚老玩家的解（旧问答本就直接判通关）。 */
let pendingToast='';
function normalizeSave(old){
  const s=newGame(old.name||'旅人', old.runIndex||1);
  Object.keys(old).forEach(k=>{ if(k!=='clue') s[k]=old[k]; });   // 显式搬，clue 单独重建
  if(!old.met){                       // 旧档没有 met / compTimes / tierComp 时的补记
    Object.keys(s.comp||{}).forEach(k=>{
      const id=k.split(':')[0]; if(!LOVER_BY[id]) return;
      s.met[id]=1; s.compTimes[id]=(s.compTimes[id]||0)+1;
    });
    Object.keys(s.aff||{}).forEach(id=>{ if(LOVER_BY[id]) s.met[id]=1; });
    Object.keys(s.deep||{}).forEach(id=>{ if(LOVER_BY[id]) s.met[id]=1; });
  }
  let migrated=false;
  CLUES.forEach(c=>{
    const v=old.clue&&old.clue[c.zone];
    if(v===true){
      s.clue[c.zone]={found:true,state:'done',keyword:c.keyword.key,wrong:false,via:'legacy'};
      migrated=true;
    } else if(v&&typeof v==='object'){
      s.clue[c.zone]=Object.assign(newClueSlot(),v);   // 新档：只补齐同类对象缺字段
      /* 【2026-11-06 通道B改选人印证 · 第四节】旧档「via='knower' 但无 speaker」是
         旧 L2 自动落点留下的假出场记录：引擎写了 knower，实际未必有人出场。
         静默回退到 raw（可重新印证）；已 done 的不动（keyword 已写，不篡改历史）。
         q.speaker 缺失时由 newClueSlot() 补 null。不设 pendingToast、不弹窗；
         H2 的 clueMigratedDone toast 在上方，逻辑独立、照常保留。 */
      const q=s.clue[c.zone];
      if(q.state!=='done' && q.via==='knower' && !q.speaker){
        q.state='raw'; q.via=null; q.speaker=null;
      }
    } else {
      s.clue[c.zone]=newClueSlot();
    }
  });
  if(migrated){
    // once:true：第一次迁移弹一次，之后存档带 flag，再读档不重复弹
    if(!(old.flags&&old.flags.clueMigratedDone))
      pendingToast=(STORY.mainline.clueScaffold.migration||{}).toast||'旧存档已按「已解读」迁移，关键词按默认补全。';
    s.flags=Object.assign({},s.flags||{});
    s.flags.clueMigratedDone=1;
  }
  /* 【甲】旧存档可能带 trust 6/7（旧版无上限），载入时一并收到 max。
     台词已改按线索取、不受影响；这里只收数值，避免 UI 显示「trust 7」。 */
  const tmax=(STORY.mainline.clueScaffold.trustPolicy||{}).max||5;
  if(!Number.isFinite(s.trust) || s.trust<0) s.trust=0;
  if(s.trust>tmax) s.trust=tmax;

  /* 【2026-11-06 结局合并 · 第四节】旧档「继续坐着」静默并入 refuse_leave。
     同时兼容清单里的字面值（sit_still / undecided / endingId）与真实旧值（stay / endId==='心意未定'）：
     真实引擎从没写过 sit_still / undecided，只认字面值会让迁移形同虚设。
     以 finaleChoice 为主判据，避免误伤「3 处兜底也用 endId==='心意未定'」的正常旧档。
     不设 pendingToast、不抛错（H2 的 clueMigratedDone toast 在上方，逻辑独立、照常保留）。 */
  const legacyStay=(s.finaleChoice==='stay' || s.finaleChoice==='sit_still'
                    || s.endId==='undecided' || s.endingId==='undecided');
  if(legacyStay){
    s.finaleChoice='refuse_leave';
    if(s.endId==='undecided' || s.endId==='心意未定' || !s.endId) s.endId='refuse_leave';
    if('endingId' in s) s.endingId='refuse_leave';
    /* 结局页标题读 S.endName；旧名「心意未定」现已归 together，同步成新名避免读档后串名。
       旧正文保留不动（玩家已看过的历史记录不篡改）。 */
    const mergeFt=(STORY.mainline.clueScaffold.finale.uiTexts||{}).forkTexts||{};
    s.endName=mergeFt.endingNameRefuseLeave||'不选之选';
  }
  /* 【2026-11-06 首周目谢寻巡查】旧档缺字段时补空，不报错、不弹窗、不迁移任何历史行为。
     上面 Object.keys(old) 会把旧档 flags 整个覆盖 newGame 的默认值，所以这里必须显式补。 */
  if(!Array.isArray(s.journalNotes)) s.journalNotes=[];
  /* 【2026-11-07 批 4】旧档补 oldRecords / fragmentShown；不追溯、不弹窗。 */
  if(!Array.isArray(s.oldRecords)) s.oldRecords=[];
  /* 【地点分区 v2】旧档没有 S.location / 不是已知地点 → 静默落回默认落点（与 newGame 同一口径）；不报错、不弹窗。 */
  if(!s.location || !LOCS[s.location]) s.location='dining_corner';
  s.flags=Object.assign({},s.flags||{});
  if(typeof s.flags.fragmentShown!=='boolean') s.flags.fragmentShown=false;
  if(!s.flags.xieXunTalked || typeof s.flags.xieXunTalked!=='object') s.flags.xieXunTalked={};
  /* 【2026-11-06 二周目第一批 · C6】旧档没有执念回应标记时补空对象：不报错、不弹窗、
     不迁移任何历史行为（一周目本来就没有执念回应）。 */
  if(!s.flags.obsessionReply || typeof s.flags.obsessionReply!=='object') s.flags.obsessionReply={};
  /* 【2026-11-07 二周目总池提示】旧档补一次性标记；已是二周目中途的档不会补弹（只在 zone===2 触发）。 */
  if(typeof s.flags.actionPoolTipShown!=='boolean') s.flags.actionPoolTipShown=false;
  /* 【2026-11-07 ⑬ 第三块牌三段递进】旧档布尔 → 计数：
     thirdSignSeen=true（看过一次）→ count=1，下次走近读「再看」；缺失 / false → 0；
     已有数字 count 原样保留。thirdSignSeen 字段不删，只在读档时读这一次，之后引擎不再写。 */
  if(!Number.isFinite(s.flags.thirdSignCount)){
    s.flags.thirdSignCount=(s.flags.thirdSignSeen===true)?1:0;
  }
  /* 【二周目第二批】旧档没有 srPool → 按一周目区间模型读，不追溯改写已存的点数。
     二周目新档自带 srPool=true，Object.keys(old) 已把它搬进来，这里不动。 */
  if(typeof s.srPool!=='boolean') s.srPool=false;
  /* 【2026-11-07 批 B′】旧档没有 runIndex：按一周目处理（补 1）；
     旧逻辑从没写过第 3 趟，>2 只能是异常值，兜底回 2。 */
  if(!Number.isFinite(s.runIndex) || s.runIndex<1) s.runIndex=1;
  if(s.runIndex>2) s.runIndex=2;
  return s;
}
function loadGame(slot){
  const raw=localStorage.getItem(PREFIX+slot); if(!raw) return false;
  try{ S=normalizeSave(JSON.parse(raw)); }catch(e){ return false; }
  if(pendingToast){ showToast(pendingToast); pendingToast=''; }   // 非阻塞 toast
  return true;
}
function startFresh(name, isSecond){
  S=newGame(name, isSecond ? 2 : 1);
  S.actionsLeft = actionTotal();   // 【2026-11-07 批 B′ 修复】总池读 actionTotal()（按 S.srPool 分流），不写死 10；一周目 3 / 二周目 10
  addLog('你登上了这趟穿雾的慢车。');
  /* 【2026-11-06 二周目第一批 · A2】zone1 教学门禁（两周目唯一分流点）：
     二周目不播三步教学，autoDone(clueByZone(1)) 系统代写 c1（done + keyword=c1_b +
     via='tutorial'），不扣点、不写 wrong、不加 trust → S.trust 从 0 起；
     一周目照旧 autoRecord(1)（教学 + H3 白送 trust 1）。autoRecord / autoDone 内部一字未动。
     eventQueue 为空时下面的 flushEvents() 自然不弹窗；巡查由 isSecondRun() 门禁挡掉。 */
  /* 【2026-11-07 批 B′】直接读参数，不读 isSecondRun()：S 刚建好、runIndex 已正确，
     用参数更直观；actionsLeft 已用 actionTotal() 初始化，下面不再写死数值。 */
  if(isSecond){
    S.srPool=true;   // 整趟共用总池，不按区间重置（actionsLeft 已由 actionTotal() 初始化）
    autoDone(clueByZone(1));
    acquireOldRecord('xiexun_eight_years');   // 【批 4】二周目 zone1 进区自动获得「谢寻八年」
    /* 【bug 修复】二周目玩家已认识所有常规角色：
       skipFirstLine 让 actMeet 不写 S.met，通道 B 候选永远空。
       这里预设非 meta 角色的 S.met=1；谢寻是 meta，不预设，走二周目初见。 */
    LOVERS_ALL.forEach(L=>{ if(L.difficulty!=='meta') S.met[L.id]=1; });
  } else autoRecord(1);
  saveGame('auto');
  $('start').style.display='none'; $('phone').style.display='flex'; renderAll();
  flushEvents();                    // 教学弹窗第一步：可跳过，跳过 = 系统代写 done
  maybeShowXieXunTip();             // 【首周目谢寻巡查】zone1：教学弹窗开着 → 挂起，关掉后再出
}
/* 【2026-11-07 批 B′】结局页「走第二趟」的确认块，走 #phone 内既有的 mask/sheet 事件队列，
   零新增 DOM / 零新增 CSS。正文与 [开始] 逐字取自 STORY.secondRun.intro（嘟嘟定稿）；
   [再想想] 是取消项，只关弹窗回结局页、不开始新局。确认才 startFresh(name,true)。 */

  const b=esc(pendingText(intro.button,'开始'));

/* 【批 5 · 多槽存档】删除自动槽的那一次点击不要再把它写回来（见 del-slot 分支）。 */
let skipAutoSaveOnce=false;
function afterChange(){ if(skipAutoSaveOnce){ skipAutoSaveOnce=false; } else { saveGame('auto'); } renderAll(); }
/* H2：一次性、非阻塞的迁移提示；不打断读档，也不进事件队列 */
function showToast(msg){
  const el=$('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>el.classList.remove('show'),3200);
}

document.addEventListener('click', e=>{

    const o=$('sheet')._opts[+t.dataset.opt];
    $('mask').classList.remove('show'); $('sheet')._opts=null;
    if(o&&o.fn) o.fn(S);
    afterChange(); flushEvents();
    flushPendingCornerTip();          // 【首周目谢寻巡查】模态队列走空后再放挂起的角落小字
    return;
  }
  if(t.dataset.tab){ S.tab=t.dataset.tab; renderAll(); return; }
  const act=t.dataset.act, id=t.dataset.id;
  /* 【2026-11-07 批 B′】开局页永远新开一周目（新的一局）。
     二周目只能从结局页「走第二趟」的确认块进入；#sr-confirm / sr-start 旧入口整条删除。 */
  if(act==='start') return startFresh($('name-in').value.trim()||'旅人', false);
  if(act==='continue'){ if(loadGame('auto')){ $('start').style.display='none'; $('phone').style.display='flex'; eventQueue=[]; renderAll(); maybeShowXieXunTip(); } return; }
  if(!S) return;
  /* 【2026-11-06 首周目谢寻巡查】点右下角角落小字 → 进 patrolTalk（0 点、不弹窗阻断） */
  if(act==='xie-tip'){
    const st=cornerTipState; clearTimeout(renderCornerTip._t); hideCornerTip();
    if(st&&st.onClick) st.onClick(S);
    return;
  }
  /* 【地点分区 v2】换地点：只改 UI 状态 + 重画。不调 afterChange()（不写自动档）、
     不耗行动点、不推 zone；等下一次正常动作触发 afterChange() 时随档保存。 */
  if(act==='loc'){ if(LOCS[id]){ S.location=id; renderAll(); } return; }
  if(act==='meet') return actMeet(id);
  if(act==='comp') return actComp(id);
  if(act==='deep') return actDeep(id);
  if(act==='know') return actKnow(id);
  if(act==='zhuyan') return actZhuYan();
  /* 【2026-11-06 祝颜主页面入口 · 最终版】旧代码改动点之二：一个分支；中撤回删这一行。
     enabled=false 时没有卡片 DOM，这个分支不会被触发；即使直接调到 openConductorPanel 也立刻 return。 */
  if(act==='conductor-card') return openConductorPanel();
  if(act==='tutorial') return tutorialEntry();
  if(act==='hotspot') return actHotspot(t.dataset.z);
  if(act==='interpret') return actInterpret(t.dataset.z, t.dataset.via==='conductor_f'?'conductor_f':'channelB');
  if(act==='write') return actWriteKeyword(t.dataset.z, t.dataset.k);
  if(act==='reread') return actReread(t.dataset.z);
  if(act==='bg') return actBg(id);
  /* 【2026-11-07 批 3】二周目彩蛋交互入口 + 旧手账残页使用入口 */
  if(act==='egg') return actEgg(id);
  if(act==='use-fragment') return useFragment();
  /* 【2026-11-06 C6 引导提示 · 方向 A】点整块提示 → 切到主线页看 C6 卡片。
     只改 S.tab + renderAll()；不改 renderAll 的强制切页（只作用于 tab==='scene'），
     不弹窗、不阻断，下面的 finale 分支照常可直接答题跳过 C6。 */
  if(act==='goto-mainline'){ S.tab='mainline'; renderAll(); return; }
  if(act==='finale'){ eventQueue=[]; return showFinale(true); }
  if(act==='next') return nextZone();
  /* 【批 5 · 多槽存档】覆盖 / 删除都走二次确认（复用 pushEvent 弹层，不新增 DOM、不写 S）。
     自动槽不提供「覆盖」——它是本局的实时快照，只能读或删。
     删除自动槽时置 skipAutoSaveOnce：否则本分支随后的 afterChange() 会立刻把它写回来，
     玩家会看到「删了又出现」。只跳过这一次写，正常游玩仍每次改动自动存。 */
  if(act==='save-over'){
    pushEvent('覆盖这个存档？原来的会被替换。',
      [{t:'覆盖',fn:()=>{ saveGame(id); }},
       {t:'再想想',fn:()=>{}}]);
    flushEvents(); return;
  }
  if(act==='del-slot'){
    pushEvent('删除这个存档？删除后不能恢复。',
      [{t:'删除',fn:()=>{ if(id===CFG.saves.autoSlot) skipAutoSaveOnce=true; deleteSlot(id); }},
       {t:'再想想',fn:()=>{}}]);
    flushEvents(); return;
  }
  if(act==='save'){ saveGame(id); addLog('已存入：'+slotLabel(id)+'。'); return afterChange(); }
  if(act==='load'){ if(loadGame(id)){ addLog('已读取：'+slotLabel(id)+'。'); eventQueue=[]; } return afterChange(); }
  /* 【2026-11-07 批 B′】一局走完：合上手账 → 感谢游玩画面 → 回到封面。
     back-to-cover 只切 UI，不清 S；存档保留本局（继续上次行程读回它）。 */
  if(act==='goto-gameover'){ S.tab='gameOver'; renderAll(); return; }
  if(act==='back-to-cover'){
    S.tab='scene';
    afterChange();
    $('start').style.display='';
    $('phone').style.display='none';
    if(localStorage.getItem(PREFIX+'auto')) $('btn-continue').style.display='block';
    return;
  }
  /* 【2026-11-07 批 B′】结局页「走第二趟」：先确认再开第 2 趟。 */
  if(act==='sr-entry'){ return openSecondRunEntry(); }
  if(act==='restart'){
    /* 【2026-11-07 批 B′】原生 confirm() 收口到 #phone 内统一的自定义确认块；
       确认后新开一周目（新的一局），取消只关弹窗。 */
    pushEvent('确定重新登车吗？当前行程会覆盖。',
      [{t:'确定',fn:()=>startFresh(S?S.name:'旅人',false)},
       {t:'再想想',fn:()=>{}}]);
    flushEvents(); return;
  }
  if(act==='export'){ prompt('复制这段存档码保存好：', btoa(encodeURIComponent(JSON.stringify(S)))); return; }
  if(act==='import'){ const code=prompt('粘贴存档码：'); if(!code) return;
    try{ S=normalizeSave(JSON.parse(decodeURIComponent(atob(code.trim())))); afterChange(); }catch(err){ alert('存档码无效。'); } return; }
});

$('intro').innerHTML='大雾漫过铁轨，列车临时停在一座不存在的站。<br><br>你手里攥着一本空白手账——这一程遇见的每个人、每件小事，都该被记下来。';
if(localStorage.getItem(PREFIX+'auto')) $('btn-continue').style.display='block';
</script>
</body>
