<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雾中车站</title>
<style>
:root{
  --bg:#eef1f2; --panel:#ffffff; --line:#dde4e3;
  --accent:#3f6f8f; --accent-soft:#e8f0f4;
  --text:#2b3639; --dim:#83949a; --warn:#b8503c; --ok:#3a8a5a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center}
button,input{font-family:inherit}
#phone{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
#start{padding:36px 26px;text-align:center;overflow-y:auto}
#start h1{font-size:26px;letter-spacing:6px;color:var(--accent);margin-bottom:8px}
#start .sub{font-size:12px;color:var(--dim);letter-spacing:2px;margin-bottom:22px}
#start .story{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:13px;line-height:2;text-align:left;margin-bottom:18px}
#start input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center;background:var(--panel);margin-bottom:10px}
#start .btn{margin-bottom:8px}
header{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.hud .who{color:var(--accent);font-weight:600;letter-spacing:1px}
.hud .date{font-size:11px;color:var(--dim);margin-top:2px}
.ap{display:flex;gap:4px;margin-top:8px}
.ap i{flex:1;height:5px;border-radius:3px;background:#e6ecec;overflow:hidden}
.ap i b{display:block;height:100%;background:var(--accent)}
.ap i.used b{background:var(--line)}
main{flex:1;min-height:0;overflow-y:auto;padding:12px}
main::-webkit-scrollbar{width:0}
.sec{font-size:12px;color:var(--accent);letter-spacing:3px;border-left:3px solid var(--accent);padding-left:8px;margin:14px 0 10px}
.sec:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font-size:12.5px;line-height:1.8}
.card .ttl{font-size:14px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.card .ttl small{font-size:10px;color:var(--dim);font-weight:400}
.card .desc{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:3px}
.card.ghost{background:transparent;border-style:dashed;opacity:.65}
.gauge{font-size:11px;color:var(--dim);margin-top:4px}
.btn{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text);text-align:left;cursor:pointer;margin-bottom:6px;line-height:1.5}
.btn:active:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-size:10px;color:var(--dim);margin-top:1px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center;font-weight:600}
.btn.ghost{text-align:center;color:var(--accent);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok);text-align:center;font-weight:600}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;text-align:center}
.tip{font-size:11px;color:var(--dim);line-height:1.8;padding:4px 2px}
/* 【2026-11-06 C6 引导提示 · 方向 A】浅色主题下把示例里的 rgba(255,255,255,.3) 边框
   换成 var(--accent)：白色半透明在 --panel:#fff 上几乎看不见。字号/透明度按定稿。 */
.c6-guide-tip{margin-bottom:12px;padding:10px 14px;border-left:3px solid var(--accent);cursor:pointer}
.c6-guide-tip .tip-main{font-size:14px;opacity:.85}
.c6-guide-tip .tip-hint{font-size:12px;opacity:.55;margin-top:4px}
/* 【2026-11-06 祝颜主页面入口 · 最终版】独立前缀 chc-，不碰现有样式；硬撤回时整块删。
   示例里的 rgba(255,255,255,.15) 边框在浅色主题(--panel:#fff)上不可见 → 换 var(--line)，
   另补与 .sec 一致的左边框强调和按钮配色；字号/透明度/间距按最终版定稿。
   chc-hint＝说明小字（解释信任点）；chc-secondrun＝二周目「她好像有话想说。」，两者分工不混用。 */
.chc-card{margin:12px 0;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;cursor:pointer}
.chc-name{font-size:15px;font-weight:600;color:var(--accent)}
.chc-loc{font-size:12px;opacity:.6;margin-top:2px}
.chc-trust{font-size:13px;margin-top:6px;letter-spacing:2px}
.chc-pending{font-size:13px;margin-top:4px;opacity:.8}
.chc-hint{font-size:11px;opacity:.45;margin-top:4px}
.chc-btn{margin-top:8px;padding:6px 14px;font-size:13px;background:var(--accent);color:#fff;border:0;border-radius:6px;cursor:pointer}
.chc-secondrun{margin-top:8px;font-size:12px;opacity:.55;font-style:italic}
/* 【角色头像 v1】56px 圆形，左侧固定，右侧文字自适应。头像 div 内先放 <img>；
   图挂了 img 自己 remove()，div 变空 → .avatar:empty::before 用 data-fb 补首字。
   这样「有图 / 没图 / 图 404」三种情况都有内容，布局不塌、不报错。
   .card-body 的 min-width:0 是防长文案（tag、按钮小字）撑破 flex 的必须项。 */
.card-head{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:0 0 56px;width:56px;height:56px;border-radius:50%;
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:600;color:var(--accent);
  border:1px solid var(--line);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar:empty::before{content:attr(data-fb)}
.card-body{flex:1;min-width:0}
.chc-head{display:flex;gap:10px;align-items:flex-start}
/* 【地点分区 v2】独立前缀 zone-loc- / loc- / staff-sec，不碰既有样式；
   enabled=false 时这些 class 一个都不会渲染出来（scene() 走旧分支）。
   标签栏换行铺开（11 个全可见，不做横向滚动——窄屏上那种滚动条是隐形的，
   玩家会以为只有前几个地点）；.loc-bg 用 background-image 铺图，图挂了自然透出 --accent-soft 底色。 */
.zone-loc-bar{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px;margin-bottom:6px}
.loc-tag{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 10px;font-size:11.5px;color:var(--text);cursor:pointer;white-space:nowrap}
.loc-tag.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.loc-tag .lc{font-size:10px;opacity:.6;margin-left:3px}
.loc-bg{width:100%;height:140px;border-radius:10px;background:var(--accent-soft);background-size:cover;background-position:center;margin-bottom:8px;border:1px solid var(--line)}
.loc-empty{font-size:11px;color:var(--dim);padding:6px 2px}
.staff-sec{font-size:12px;color:var(--accent);letter-spacing:3px;border-left:3px solid var(--accent);padding-left:8px;margin:14px 0 10px}
.done{color:var(--ok)}
.log{font-size:11.5px;color:var(--dim);line-height:1.9}
.log div{border-bottom:1px dashed var(--line);padding:3px 0}
.log div:last-child{border:none}
nav{flex-shrink:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;padding:5px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:16px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
#mask{position:absolute;inset:0;background:rgba(20,32,36,.45);display:none;align-items:flex-end;z-index:9}
#mask.show{display:flex}
#sheet{width:100%;background:var(--panel);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto}
#sheet .st{font-size:14px;line-height:1.95;margin-bottom:14px}
#sheet .st .nm{color:var(--accent);font-weight:600}
#sheet .st .desc{color:var(--dim);font-size:12px;display:block;margin-top:6px}
#sheet .end-title{font-size:18px;letter-spacing:3px;color:var(--accent);text-align:center;margin-bottom:12px}
#toast{position:absolute;left:16px;right:16px;bottom:70px;background:rgba(43,54,57,.92);color:#fff;font-size:12px;line-height:1.7;padding:10px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:12}
#toast.show{opacity:1}
/* 【2026-11-06 首周目谢寻巡查】落点 B：右下角角落小字。z-index 11 > #mask 的 9，
   模态开着时仍可见可点；本身不弹窗、不阻断，3 秒淡出。 */
#corner-tip{position:absolute;right:14px;bottom:96px;max-width:210px;text-align:right;background:rgba(43,54,57,.9);color:#fff;font-size:11px;line-height:1.7;padding:8px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:11;cursor:pointer}
#corner-tip.show{opacity:1;pointer-events:auto}
.journal-notes .note-small{font-size:11px;color:var(--dim);line-height:1.8;padding:3px 2px}
</style>
</head>
<body>

<div id="start">
  <h1>雾 中 车 站</h1>
  <div class="sub">— 一 趟 穿 雾 的 慢 车 —</div>
  <div class="story" id="intro"></div>
  <input id="name-in" type="text" maxlength="8" placeholder="给自己取个名字" value="旅人">
  <button class="btn primary" data-act="start">登 车</button>
  <button class="btn ghost" data-act="continue" id="btn-continue" style="display:none">继续上次行程</button>
  <!-- 开发标记已清理：原文是第 5 课 / 第三批的机制说明，玩家不需要看 -->
</div>

<div id="phone" style="display:none">
  <header>
    <div class="hud">
      <div><div class="who" id="h-name"></div><div class="date" id="h-date"></div></div>
      <div class="ap" id="h-ap"></div>
    </div>
  </header>
  <main id="stage"></main>
  <nav id="tabs"></nav>
  <div id="mask"><div id="sheet"></div></div>
  <div id="toast"></div>
  <div id="corner-tip"></div>
</div>

<script>
/* ===================================================================
   雾中车站 · 第 5 课：主线任务化 + 第 6 区间终局
   沿用四层框架。数据由构建时注入（单一真相源 step2-story-data.json）。

   本课已拍板 + 第二 / 第三批落地：
   ① 终局＝三空逐空选词（Q3 口径 C）：≤1 空→BE「雾中迷失」且锁死同行；
     对 2 空→不完整通关 + 独行文本短一段；三空全对 + 五枚 done→完整档（M7）。
     【B3】正确词只在「已读懂」时进候选池；没读懂的空照样给 5 个同款错误候选、
     不提示「你漏了」；选错＝降档标记，不直接 BE。问答阶段 escape 已删。
   ② 【第二批 2.1–2.8】线索不再自动记：点热点 found → 找人印证 pending → 自己写关键词 done。
     只有 done 计入 interpretedCount；clueCount() 数 found，主线页双显示「记下 x / 读懂 y」。
     zone1 教学由系统代写直接 done、弹窗可跳过；从 zone2 起 R2 严格执行，写错不可逆。
   ③ courage 全部退休（常量 / 三处 gauge / newGame / reached / thText），
     沈砚 hard 门槛改挂 interpretedCount>=4；知情人分档、俞星 crossCheck 同步改挂。

   ⚠️ 标「占位 /【待写】」的文案都由嘟嘟写，引擎只做占位回退，不代写剧情。
   =================================================================== */

const STORY = {
  "meta": {
    "project": "雾中车站",
    "note": "以下文案全部来自嘟嘟的设定，原样保存（注明 changedBy 的最小替换除外），供 step2 的游戏数据按 id 取用；引擎只负责读取，不改写内容。",
    "rosterFile": "step2-roster.html",
    "pending": [
      "每位可攻略角色的去向（南城 / 北市）未定，关系到「到站背道而驰」的张力与【同路而行】结局",
      "6 枚线索的措辞可改，但结构已锁（见 mainline.clueScaffold）；需定 2~3 条对应哪件已有信物",
      "「雾的真相」在第 6 区间与【与雾同行】里的具体说法待写",
      "老冯改餐车管理员后的具体称呼、口头禅与闲聊台词待写",
      "第 6 区间隐藏抉择【与雾同行】的选项文案待写（判定已定为主动抉择）",
      "谢寻「说不清的眼熟」由谁点破待定（老冯挪到餐车后更顺：建议餐车闲聊点破，或手账一条旧记录）",
      "谢寻的专属支线任务未写（其余 5 位已给）",
      "知情人各档的精细爆料文案待写（引擎现按标点自动切 N.text，填 reveal 数组可覆盖）"
    ],
    "resolved": [
      "重要 NPC 定编 7 位（祝颜 + 6 位知情人），第 8 槽按嘟嘟意思取消，不再补另一位雾线引路人",
      "谢寻的带教师傅唯一是祝颜；老冯不再带教；按 R4「雾补身份」收，八年资历与「新人」记忆都是被同化后补上的",
      "老冯由「当班列车长」改「餐车管理员」，车上不再有两个「长」，且他随时能出现聊天",
      "【与雾同行】按推荐落地为第 6 区间主动抉择（mode: activeChoice），不做无心意对象时的自动兜底",
      "老冯是真实在岗、正常轮班的员工，不是被雾同化者；两处易混淆的资历与节日设定已删",
      "两位角色改名并同步全部 id 与引用：急诊医生 → 苏叶、照相馆老板 → 周仲",
      "温叙信物「备用琴弦套装」由背景NPC 韩守义（退休提琴修理师）对话触发掉落（提到「朋友琴弦断了」），首周目即得，Conditional 路线不再依赖二周目彩蛋；另补 4 位纯氛围背景NPC（ops / 二战女生 / 带娃妈妈 / 退休老师傅），台词均扣「选择」主题",
      "第 7 课：重要 NPC 探索机制定为 A+C（分段爆料零额外行动点 + 按区间出场的场景门槛），B 情报交叉只给俞星（须用手账第 4 笔印证）。",
      "按嘟嘟补充文档同步 6 位角色结局名 / 正文 / 到站台词（沈砚 HE 为你留步、陆野 HE 此心安处、温叙 BE 曲终人散、谢寻 HE 重写为「脱下制服一起下车」、林昼 HE 删「为你留在雾中」以免与 R4 冲突）。",
      "谢寻核心遗憾改写为「雾补身份 / 潜意识逃避选择」，原「真实值乘八年」段收编为雾补记忆并存入 woundOriginal；陈桂兰段「苏予」统一为苏叶；老冯节日设定不再出现。",
      "2026-11-05 定稿·三条硬冲突：H1 去掉「一个人下车」的 interpretedCount≥4 门槛（保住 M.glimpse 二周目钥匙），interpretedCount 只用于完整度标记与第三块牌；H2 旧档 true 映射为 done + 一次性迁移 toast，normalizeSave 显式遍历、不用 Object.assign 浅合并；H3 zone1 教学系统代写关键词直接 done、弹窗可跳过也是 done，R2 从 zone2 起严格执行。",
      "2026-11-05 定稿·M1–M8：原话片段候选 / 抽象词只进结局文本；keyword 写错不可逆且 pending 先看整句；热点点了才有、全走 B 的 trust 下限 1；trust 台词按实际档位而非区间索引；俞星 crossCheck 读 clue[4].state==='done'；通道 B 只给好感不碰 S.deep；第 3 枚 distractor 作错误候选进池、完整档＝blank 三枚+第 5/6 枚共 5 枚 done；「合上手账」单独 setEnding('refuse_leave')、mainlinePassed 保持 true、问答阶段删除 escape。",
      "2026-11-05 定稿·清单补漏全部采纳：旧二周目配置须改本 JSON 再重新注入 HTML；flushEvents 给 opt 加 disabled 并渲染 disabled 属性（分岔台灰选项可提示、线索候选不提示，两处不一刀切）；主线页双显示「记下 x / 读懂 y」；sanityCheck 加三条体检（done 上限 6≥4、每空 1 正确+≥2 错误 token、blankIndex 覆盖 0/1/2）；Q3「短一段」只作用于【雾的真相·独行】文本不强制独行；tierOf 第 5 阶副作用标为设计意图。",
      "2026-11-05 定稿·四批落地顺序：第一批数据结构（本轮，只改 step2-story-data.json，不碰引擎/HTML）→ 第二批引擎动作 → 第三批终局判定 → 第四批文案挂接与 STORY 重新注入。祝颜定名已确认，引擎与 JSON 本就是祝颜，不动。",
      "2026-11-05 第一批数据结构落地：mainline.clueScaffold 升级为六枚 {id,zone,hotspot,tokens,interpret{via,cost,text},keyword{key,useFor,blankIndex},state} + runtimeShape / counters / migration / trustPolicy / finale / completeness / fork / sanityRules；knowerDepth.clue 改挂 interpretedCount>=3；crossCheck.yu_xing 改读 clue[4].state==='done' 且不碰 S.deep；difficultyAssignment.gates.hard 只动沈砚；mainline.patches 旧二周目配置已换新口径。clueScaffold-batch1.json 为可直接粘贴的独立副本。",

const LOCS = (STORY.mainline||{}).locations || {};
const LOC_GROUPS = ['dining','seat','sleeper','connector','tail','end'];   // 标签栏固定排序
function locOn(){ return !!(CFG.locationSystem && CFG.locationSystem.enabled); }
function locOf(id){ return LOCS[id] || null; }
function locName(id){ const L=locOf(id); return L ? (L.name||id) : ''; }
/* 一串地点 id：按 group 固定顺序排；没写 group 的按数据顺序垫在最前。 */
function locOrder(){
  const ids=Object.keys(LOCS);
  const rank=id=>(LOC_GROUPS.indexOf((LOCS[id]||{}).group)+1)||0;
  return ids.map((id,i)=>({id,i})).sort((a,b)=>{
    const d=rank(a.id)-rank(b.id);
    return d!==0 ? d : a.i-b.i;
  }).map(x=>x.id);
}

   批 1 拆出 activeLovers()/LOVERS_ALL 后保留该别名，使既有回归探针（fog_regress 等直接引用 LOVERS）语义不变。 */
const LOVERS = STORY.lovers.filter(L=>L.difficulty!=='meta');
function activeLovers(){
  return LOVERS_ALL.filter(L=>{
    if(L.difficulty==='meta') return isSecondRun() && !!L.secondRun;
    return true;
  });
}
const LOVER_BY = Object.fromEntries(STORY.lovers.map(L=>[L.id,L]));
const KEY_BY   = Object.fromEntries((STORY.keyNpcs||[]).map(N=>[N.id,N]));
const CLUES    = STORY.mainline.clueScaffold.clues;

/* ── 第 7 课：重要 NPC 探索（A 分段爆料 / C 场景门槛 / B 俞星情报交叉） ──
   配置全在 STORY（step2-story-data.json），引擎不写死剧情。
   想调谁在哪几节出现，改 JSON 的 knowerScenes.scenes 就行。 */
const K_SCENES = (STORY.knowerScenes||{}).scenes || {};
const K_DEPTH  = STORY.knowerDepth || {bonusByHit:[2,2,4,4,6]};
const CROSS    = (STORY.crossCheck||{}).yu_xing || null;
const KNOW_MAX = Math.max.apply(null, K_DEPTH.bonusByHit||[6]);

/* C：知情人只在自己的区间里出现——车开到哪一节，就见得到哪一节的人。
   不额外耗行动点，顺带让 6 个区间的场景终于有了差别。 */
function knowerHere(id){
  const sc=K_SCENES[id];
  return !sc || (sc.zones||[]).indexOf(S.zone)>=0;
}
/* A：到场时攒了什么，决定他肯说多少。4 个条件都不额外耗点：
   走到后半程 / 先见过本人 / 已解读 ≥3 笔 / 祝颜 trust ≥2（甲方案后 trust 为纯数值，不再对应台词档位）。
   【第二批 / Q1① / 迁移清单】clue 条件改读 interpretedCount（done 数），不再读 found 数。 */
function knowerHits(N){
  let n=0;
  if(S.zone>=3) n++;
  if(N.for && S.met[N.for]) n++;
  if(interpretedCount()>=3) n++;
  if(S.trust>=2) n++;
  return Math.min(n,4);
}
function knowerBonusOf(hits){
  const a=K_DEPTH.bonusByHit||[2,2,4,4,6];
  return a[Math.min(hits,a.length-1)];
}
/* 文案零新增：把知情人原文切成「半句 / 多半句 / 全说了」三档。
   ⚠️ 必须按逗号也切——知情人原文都是一整句长句，只按句末标点切会一刀不出，
      分段爆料就形同虚设（这是实测踩过的坑）。
   想写更精细的档位，在 JSON 里给该 NPC 填 reveal:[半句, 多半句, 全句] 即可覆盖。 */
const K_SPLIT = /[^，；。！？]+[，；。！？]?/g;
function knowSegs(N){ return String(N.text||'').match(K_SPLIT)||[]; }
function knowLine(N,hits){
  const rv=N.reveal;
  if(Array.isArray(rv)&&rv.length>=3) return rv[hits<=1?0:hits<=3?1:2];
  const segs=knowSegs(N);
  if(segs.length<2) return N.text||'';
  if(hits<=1) return segs[0]+'……';
  if(hits<=3) return segs.slice(0,segs.length-1).join('')+'……';
  return N.text||'';
}

/* 数据适配层：STORY（文案源）里背景NPC 的字段名和引擎读的不一样，这里统一成引擎认的形状。
   少了这层，「韩守义掉弦」会静默失效——他变成纯闲聊 NPC，温叙 conditional 永远打不开。 */
const BG_ALL = (STORY.ambientDroppers||[]).map(n=>{
  const d=n.dialogue||{};
  return Object.assign({},n,{
    dropper:true,
    gives:n.gives||[n.givesItem,n.bonusItem].filter(Boolean),
    casual:d.casual||n.casual||'',
    itemTrigger:d.itemTrigger||n.itemTrigger||'',
    itemTriggerHint:d.itemTriggerHint||n.itemTriggerHint||'',
    title:n.title||n.role||''
  });
}).concat((STORY.ambientNpcs||[]).map(n=>Object.assign({},n,{
  dropper:false,
  secondRunHidden: n.secondRunHidden===true,
  secondRunText: n.secondRunText||''
})));
const BG_BY    = Object.fromEntries(BG_ALL.map(n=>[n.id,n]));

/* 【2026-11-07 批 3】二周目彩蛋 NPC；一周目不显示。
   每个彩蛋按 zone 出现（当前 zone 对上才显示），每趟只结算一次（S.flags.eggDone[id]）。
   旧手账残页 / 信物赠送 / 谢寻 HE 线索池对接见对应函数。 */
const EGGS = (STORY.secondRun||{}).easterEggs||{};
function eggHere(id){
  if(!isSecondRun()) return false;
  const e=EGGS[id];
  if(!e || e.zone!==S.zone) return false;
  if((S.flags.eggDone||{})[id]) return false;
  /* condition 是字符串形式的简单判定：isGlimpseActive() / c4.state === 'done' / 旧记录碎片 ≥3 条 */
  if(e.condition==='isGlimpseActive()') return isGlimpseActive();
  if(e.condition && /c4\.state/.test(e.condition)) return clueOf(4).state==='done';
  if(e.condition && /旧记录碎片/.test(e.condition)) return legacyRecordCount()>=3;
  return true;
}
function legacyRecordCount(){
  /* 【2026-11-07 批 4 · 3.5】从批 3 的 interpretedCount 临时估算改为读真实旧记录条数。
     彩蛋四 egg_fog_child 的「旧记录碎片 ≥3 条」condition 由此自动生效。 */
  return Array.isArray(S.oldRecords) ? S.oldRecords.length : 0;
}

/* ---------- ② 状态 S / M ---------- */
function newGame(name, runIndex){
  const r = (runIndex === 2) ? 2 : 1;
  return {
    name:name||'旅人', tab:'scene', zone:1, actionsLeft:CFG.actionsPerZone[0],
    /* 【地点分区 v2】当前位置：纯 UI 状态，不参与任何判定；旧档缺字段由 normalizeSave 补默认落点。
       【2026-11-08】默认落点从「餐车·吧台」（常年 0 人）改成「餐车·角落」——开局第一屏就有人可交互。 */
    location:'dining_corner',
    /* 【2026-11-07 批 B′】本局第几趟：1=一周目 / 2=二周目。一局只含这两趟，
       第 3 趟起是新一局的一周目。周目判定只读它，不再读全局累计的 M.playCount。 */
    runIndex:r,
    srPool:(r===2),   // 整趟总池；与 actionTotal() 读源一致，startFresh() 仍显式置位 actionsLeft=10
    trust:0, aff:{}, met:{}, comp:{}, compTimes:{}, tierComp:{}, deep:{}, know:{}, knowBonus:{},
    clue:CLUE_SLOTS(),          // 【第二批】六枚 {found,state,keyword,wrong,via}，见 newClueSlot()
    bag:{}, flags:{xieXunTalked:{}, obsessionReply:{}, actionPoolTipShown:false, thirdSignCount:0, fragmentShown:false},   // 一次性标记 / 第三块牌三态计数 / 【批 4】残页是否已展开
    journalNotes:[],             // 【2026-11-06 首周目谢寻巡查】手账杂记；不计入 6 枚 / 不进三空判定
    oldRecords:[],               // 【2026-11-07 批 4】二周目旧记录（双栏 / 旧记录碎片计数）；一周目恒空
    clueTags:{},                  // 【批 1】谢寻 HE 线索计数仓：记录已收集的关键线索 tag（laofeng_dialog / xiexun_photo 等）；与 6 枚手账 clue 互不干扰
    mainlinePassed:null,   // null=未问答 / true=拼出答案 / false=没拼出或逃避
    finaleStarted:false, finaleChoice:null,
    /* 【第三批】三空选词与完整性标记 */
    finaleAnswers:[null,null,null],   // 每空选中的 token key（B3：弃答选项已删，必选一个）
    incompleteMarks:[false,false,false],
    completeRun:false,                // 三空全对 + 五枚 done（M7 完整档）
    shortSolo:false,                  // 对 2 空 → 独行文本短一段（Q3 补漏，不强制独行）
    endId:null, endName:null, endText:null, endLine:null, endWho:'',
    log:[]
  };
}
let S = null;
function loadMeta(){
  try{
    const m=Object.assign({playCount:0,glimpse:false,completedRuns:0,endings:{}}, JSON.parse(localStorage.getItem('fog_meta')||'{}'));
    /* 【2026-11-06 结局合并 · 3.3 / 第四节】旧周目图鉴里的 undecided / sit_still 计数
       并入 refuse_leave 后删键。M 是独立于 S 的存档（fog_meta），所以这一段必须放在 loadMeta。
       幂等：不写回、每次读档自动归并；不抛错、不弹窗。
       注：真实旧档 stay 用的 id 是「心意未定」，该键仍是 3 处兜底的有效 id，不在此删除。 */
    if(m.endings && (m.endings.undecided || m.endings.sit_still)){
      m.endings.refuse_leave=(m.endings.refuse_leave||0)+(m.endings.undecided||0)+(m.endings.sit_still||0);
      delete m.endings.undecided; delete m.endings.sit_still;
    }
    /* 【2026-11-07 BE 键名迁移】旧图鉴键并入新键后删旧键。
       幂等、不写回、不弹窗、不抛错。
       真实旧档 setEnding 曾把 name 当 id（旧键带 'BE · ' 前缀），故按包含旧键名统一归并，
       避免只认字面键让迁移形同虚设。 */
    if(m.endings){
      const oldKeys=Object.keys(m.endings).filter(k=>k.indexOf('融进雾里')>=0);
      if(oldKeys.length){
        let sum=0;
        oldKeys.forEach(k=>{ sum+=(m.endings[k]||0); delete m.endings[k]; });
        m.endings['雾中迷失']=(m.endings['雾中迷失']||0)+sum;
      }
    }
    /* 【2026-11-07 批 B′】旧 fog_meta 没有 completedRuns 时补 0，不写回、不弹窗。 */
    if(!Number.isFinite(m.completedRuns)) m.completedRuns=0;
    return m;
  }
  catch(e){ return {playCount:0,glimpse:false,completedRuns:0,endings:{}}; }
}
function saveMeta(m){ try{ localStorage.setItem('fog_meta', JSON.stringify(m)); }catch(e){} }
let M = loadMeta();
/* 【2026-11-07 批 B′】周目判定唯一入口：一局 = 一周目 + 二周目，只有第 2 趟是二周目。
   读 S.runIndex（本局标记），不再读 M.playCount —— 后者是全局累计通关次数，
   打完一周目后读回一周目中途旧档会被误判成二周目；第 3 趟起是新一局的一周目，
   二周目内容一律关闭。S 尚未建立时返回 false。 */
function isSecondRun(){ return !!(S && S.runIndex === 2); }
/* 【FAST】二周目减负的唯一入口：所有 fast 分支都调这里，不散写组合条件。
   一周目恒 false（isSecondRun 门禁），开关关闭 / 字段缺失也恒 false → 完全回退。 */
function fastOn(){ return isSecondRun() && !!(CFG.fastMode && CFG.fastMode.enabled); }
/* 【2026-11-07 批 B′】M.glimpse 是「曾经看过真相」的永久记录，但只有第 2 趟生效：
   残页 / 谢寻线 / 与雾同行 / 彩蛋三 / 祝颜卡片小字都读它。第 3 趟起返回 false，
   二周目内容全部关闭。setEnding() 里 if(glimpse) M.glimpse=true 是写入，不走这里。 */
function isGlimpseActive(){ return isSecondRun() && M.glimpse === true; }
/* 【2026-11-07 二周目第二批 / 批 B′】行动点分母单一来源。
   只读 S.srPool（newGame 按 runIndex 初始化、startFresh 显式置位），
   不调 isSecondRun()：周目判定与行动点模型各读各的本局标记，互不串。
   一周目 srPool=false → 逐字沿用区间表；二周目 true → 整趟 10 点。 */
function actionTotal(){ return (S && S.srPool) ? CFG.actionsSecondRun : CFG.actionsPerZone[(S?S.zone:1)-1]; }

/* ---------- ③ 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 【2026-11-06 结局合并】两段定稿正文按嘟嘟原稿带 \n 分行；先 esc 再把换行转成 <br>，
   否则 innerHTML 会把换行折叠成空格，「你只是选了不选。」单独成行的停顿就没了。 */
const nl2br = s => esc(s).replace(/\n/g,'<br>');
function addLog(t){ S.log.unshift('第'+S.zone+'区间 · '+t); S.log=S.log.slice(0,40); }

/* ---------- 【第二批 2.1 / 2.6】线索三态与双计数器 ----------
   STORY 里每枚 clues[].state 只是初始模板 'raw'，绝不写回 STORY；铁律仍是「只改 S」。 */
function newClueSlot(){ return {found:false,state:'raw',keyword:null,wrong:false,via:null,speaker:null}; }
function CLUE_SLOTS(){ const o={}; CLUES.forEach(c=>{ o[c.zone]=newClueSlot(); }); return o; }
function clueByZone(z){ return CLUES.find(c=>c.zone===+z)||null; }
function clueOf(z){
  const k=+z;
  if(!S.clue[k]||typeof S.clue[k]!=='object') S.clue[k]=newClueSlot();
  return S.clue[k];
}
function clueCount(){        // 「记下 x」：只数 found===true（M3：不点不加）
  return CLUES.filter(c=>{ const x=S.clue[c.zone]; return x&&x.found===true; }).length;
}
function interpretedCount(){ // 「读懂 y」：只数 state==='done'（Q1① / H1）
  return CLUES.filter(c=>{ const x=S.clue[c.zone]; return x&&x.state==='done'; }).length;
}
/* 第四批文案挂接前，所有【待写】占位都在这里回退，玩家看不到占位符，也不代写剧情。 */
function pendingText(t,fallback){ return (typeof t==='string'&&!/^\s*【待写/.test(t)) ? t : fallback; }
function tokenText(t){ return pendingText(t.text,'（原话片段待写 · '+t.key+'）'); }
function fullSentence(c){ return pendingText(c.interpret.text, c.hook+'。'+c.record); }
/* 【第四批】手账里显示「写入的词」(tokens[].word)，而不是内部 key。
   S.clue[].keyword 仍存 key（存档兼容 / normalizeSave 不动），只在渲染时做一次映射。 */
function keywordLabel(c,key){
  const t=(c.tokens||[]).find(x=>x.key===key);
  return t ? pendingText(t.word,tokenText(t)) : (key||'—');
}
/* 【第四批 · ②】C5/C6 是 forkFlag、不填空：选词界面顶部补「提示一行 + 题干一行」，
   画风与三空一致（nm 引导语 / desc 题干），避免玩家以为这三枚也要填进那三句话。
   文案权威在 finale.uiTexts.c5Hint/c5Prompt/c6Hint/c6Prompt。 */
function quizHead(c){
  if(c.keyword.useFor!=='forkFlag') return '';
  const u=STORY.mainline.clueScaffold.finale.uiTexts||{};
  const k=c.id==='c5'?'c5':'c6';
  return `<span class="nm">${esc(pendingText(u[k+'Hint'],'……'))}</span><br>`
       + `<span class="desc">${esc(pendingText(u[k+'Prompt'],'……'))}</span><br>`;
}
/* 【甲 · 嘟嘟 2026-11-06 拍板】祝颜半句按「当前正在印证的线索」取，不再按累计 trust 档位：
     问 c2 就答车窗字那句、问 c4 就答巡检本那句；跳着玩 / 走通道 B / 补点热点都不会串。
     映射在 STORY.mainline.clueScaffold.trustPolicy.lineByClue（值＝tiers 的 1-based 序号），
     C6 暂复用第 5 档，以后补专属句只改数据。没映射才回退旧的按 S.trust 取档（老存档兼容）。
   S.trust 退为纯数值：只用于知情人爆料 knowerHits 的 >=2 与 UI 计数，上限 trustPolicy.max。 */
function trustLine(c){
  const tp=STORY.mainline.clueScaffold.trustPolicy||{};
  const tiers=tp.tiers||[], map=tp.lineByClue||{};
  const n=c&&map[c.id], byClue=n&&tiers[n-1]&&tiers[n-1].line;
  const hit=tiers.filter(t=>t.at<=S.trust).pop();
  return pendingText(byClue||(hit&&hit.line),'她点到即止，像隔着一层水汽，没有再说下去。');
}
/* S.trust 唯一增长口：三处 +1 全走这里，统一 clamp 到 trustPolicy.max（默认 5）。
   旧版能涨到 6/7、UI 显示「递过 7 次半句」且第 5 档连说三遍，甲方案后一并收住。 */
function addTrust(n){
  const tp=STORY.mainline.clueScaffold.trustPolicy||{};
  const max=tp.max||5;
  S.trust=Math.min(max,(S.trust||0)+(n||0));
}

/* 【2026-11-07 批 2】二周目祝颜高档台词：trust 达到 at 且未听过时播，每档只一次。
   播完（可能连着多档）调 callback 继续原流程。一周目直接 callback，不触发。
   文案全在 trustPolicy.secondRunTiers；flag 记 S.flags['srTier_N']，新局自动重置。 */
function maybePlaySecondRunTier(callback){
  if(!isSecondRun()){ if(callback) callback(); return; }
  const tiers=((STORY.mainline.clueScaffold.trustPolicy||{}).secondRunTiers||{}).tiers||[];
  const newTiers=tiers.filter(t=>S.trust>=t.at && !(S.flags&&S.flags['srTier_'+t.at]));
  if(!newTiers.length){ if(callback) callback(); return; }
  playNextTier(newTiers, callback);
}
function playNextTier(tiers, callback){
  if(!tiers.length){ if(callback) callback(); return; }
  const t=tiers[0];
  S.flags=S.flags||{}; S.flags['srTier_'+t.at]=true;
  pushEvent(`<span class="nm">祝颜</span><br>${esc(t.line)}`,
    [{t:'……', fn:()=>playNextTier(tiers.slice(1), callback)}]);
  flushEvents();
}

/* 好感阶 1~5：前 3 阶按数值，后 2 阶按剧情事件。传角色对象，不传裸数值。 */
function tierOf(L){
  const a=S.aff[L.id]||0;
  // 设计意图（清单补漏）：第 5 阶改挂 interpretedCount 后，会出现「做完深度事件但解读不够，停在交心」
  // ——这是有意的，贴「看懂雾才敢交心」，别当 bug 修。
  if(S.deep[L.id]) return reached(L) ? 5 : 4;     // 心意 / 交心
  let t=1; CFG.tiers.forEach((v,i)=>{ if(a>=v) t=i+1; });
  return t;                                        // 陌路 / 眼熟 / 熟络
}
function tierName(L){ return CFG.tierNames[tierOf(L)-1]; }

/* 分阶陪伴文案：只取已填的句子（TODO 开头自动忽略），同阶内按顺序轮换 */
function compLine(L,t){
  const arr=(COMP_LINES[L.id]||{})[t]||[];
  const usable=arr.filter(s=>s && !/^\s*TODO/i.test(s));
  if(!usable.length) return L.firstLine;          // 没写就回退首遇台词
  const n=S.tierComp[L.id+':'+t]||0;
  return usable[Math.min(n,usable.length-1)];
}

/* 数值体检：以后你调门槛时，它会在控制台替你拦下「好结局全锁死」这类事故 */
function sanityCheck(){
  const maxNoDeep = CFG.actionsPerZone.filter(v=>v>0).length*CFG.companionBonus + KNOW_MAX;
  if(CFG.deepUnlock>maxNoDeep)
    console.warn('[雾中车站·数值警告] deepUnlock='+CFG.deepUnlock+' 超过「不靠深度能拿到的最大好感」'+maxNoDeep+'，深度剧情将永远无法触发，所有 HE 一起锁死。');
  const minHE=Math.min(CFG.threshold.normal,CFG.threshold.conditional);
  if(maxNoDeep+CFG.deepBonus<minHE)
    console.warn('[雾中车站·数值警告] 单人好感上限 '+(maxNoDeep+CFG.deepBonus)+' < HE 门槛 '+minHE+'，好结局不可达。');
  /* 【第二批 2.8 / 清单补漏】I1 / I2 / I3 三条结构体检 */
  const hardNeed=CFG.threshold.hard.interpretedCount;
  if(CLUES.length<hardNeed)
    console.warn('[雾中车站·I1] 理论 done 上限 '+CLUES.length+' < hard 门槛 '+hardNeed+'，沈砚 HE 永远不可达。');
  const blanks=(STORY.mainline.clueScaffold.finale||{}).blanks||[];
  blanks.forEach(b=>{
    const c=CLUES.find(x=>x.id===b.clueId);
    if(!c){ console.warn('[雾中车站·I2] 空'+b.index+' 指向的线索 '+b.clueId+' 不存在。'); return; }
    const right=c.tokens.filter(t=>t.key===c.keyword.key).length;
    const wrong=c.tokens.filter(t=>t.key!==c.keyword.key).length;
    if(right<1||wrong<2)
      console.warn('[雾中车站·I2] 空'+b.index+'（'+c.id+'）正确 key '+right+' 个 / 错误 token '+wrong+' 个，需 ≥1 正确 + ≥2 错误。');
  });
  /* 【B2 补充 · 嘟嘟 2026-11-06 拍板】每空三档候选池都要 ≥ candidateCount，
     且 done 档必须含正确 key（raw / missed 档必须不含）——防止第四批改文案后
     某个空凑不够 5 个静默降级，或正确词意外泄进未读懂档。
     直接调 blankPool() 同一套纯函数算法，体检与实际运行不会漂移。 */
  const need=(STORY.mainline.clueScaffold.finale||{}).candidateCount||5;
  blanks.forEach(b=>{
    ['done','raw','missed'].forEach(mode=>{
      const pool=blankPool(b,mode), has=pool.indexOf(b.answerToken)>=0;
      if(pool.length<need || (mode==='done' ? !has : has))
        console.warn('[雾中车站·I2] 空'+b.index+' 的 '+mode+' 档候选池 '+pool.length+' 个 / 正确词'+(has?'在池内':'不在池内')
          +'，需 ≥'+need+' 个且'+(mode==='done'?'含':'不含')+'正确词。');
    });
  });
  const idx=CLUES.filter(c=>c.keyword.useFor==='blank').map(c=>c.keyword.blankIndex).sort((a,b)=>a-b).join(',');
  if(idx!=='0,1,2')
    console.warn('[雾中车站·I3] blankIndex 应覆盖 0,1,2 无重无缺，当前为 '+idx+'。');
  /* 【批 1 · 3.7】二周目谢寻线体检：总池太小跑不动谢寻线；HE 门槛超过总池理论上限（池×4）则锁死。 */
  if(CFG.actionsSecondRun<4)
    console.warn('[雾中车站·二周目] 二周目总池 '+CFG.actionsSecondRun+' < 4，不足以推进谢寻线（陪伴 0 点但旧照片需好感 12）。');
  const xt=(CFG.threshold.xie_xun||{}).secondRun;
  if(xt && xt.he > CFG.actionsSecondRun*4)
    console.warn('[雾中车站·二周目] 谢寻 HE 门槛 he='+xt.he+' 超过二周目总池理论上限 '+(CFG.actionsSecondRun*4)+'，不可达。');
  /* 【批 2】二周目 trust 软门槛与高档台词的一致性体检：secondRunTiers 最低档 at 必须
     ≤ softGate.trustDirectThreshold，否则 trust 够直接进【与雾同行】、高档台词永远听不到。 */
  const sg2=(STORY.mainline.clueScaffold.finale||{}).alongWithFogSoftGate||{};
  const srTiers=((STORY.mainline.clueScaffold.trustPolicy||{}).secondRunTiers||{}).tiers||[];
  if(sg2.trustDirectThreshold && srTiers.length && Math.min(...srTiers.map(t=>t.at)) > sg2.trustDirectThreshold)
    console.warn('[雾中车站] secondRunTiers 最低档 at 高于 softGate.trustDirectThreshold，可能永远听不到高档台词。');
  /* 【甲 · I4】祝颜半句映射体检：6 枚线索都要有映射，且档号指向存在的台词。
     以后给 c6 补专属句时，漏配会在启动阶段直接报警，不会静默回退到旧档位口径。 */
  const tp=STORY.mainline.clueScaffold.trustPolicy||{}, map=tp.lineByClue||{}, ts=tp.tiers||[];
  CLUES.forEach(c=>{
    const n=map[c.id];
    if(!n || !ts[n-1] || !ts[n-1].line)
      console.warn('[雾中车站·I4] 线索 '+c.id+' 的祝颜半句映射缺失或档号越界（当前 '+n+'）。');
  });
  /* 【C1 三步教学 · I6】与数据层 sanityRules.checks[I6] 同源：
     教学第一步必须与第 1 档祝颜半句逐字一致；候选恰好 3 个合法 key 且含正确项；
     收尾必须带逻辑桥；c1 的 via 不得含 knower/lover（否则会冒出通道 A/B 按钮）。 */
  const tc=CLUES.find(c=>c.id==='c1')||{}, tcs=(tc.tutorial||{}).steps||[];
  const tline=ts[0]&&ts[0].line;
  if(!tcs[0] || tcs[0].text!==tline)
    console.warn('[雾中车站·I6] 教学第一步与 trustPolicy.tiers[0].line 不同源。');
  const tk=(tcs[1]||{}).tokens||[];
  if(tk.length!==3 || tk.indexOf(tc.keyword.key)<0 || tk.some(k=>!(tc.tokens||[]).some(t=>t.key===k)))
    console.warn('[雾中车站·I6] 教学 token 候选不是 3 个合法 key，或漏了正确项。');
  if(!tcs[2] || !/原来是还没到的站/.test(tcs[2].text||''))
    console.warn('[雾中车站·I6] 教学收尾缺「原来是还没到的站」这句逻辑桥。');
  const tvia=(tc.interpret||{}).via||[];
  if(tvia.indexOf('knower')>=0||tvia.indexOf('lover')>=0)
    console.warn('[雾中车站·I6] c1 的 interpret.via 含 A/B 入口，教学枚应只有 tutorial。');
  /* 【通道B选人印证 · I5】hint 必须按 loverId 索引、6 条 channelB* 文案齐备。
     与数据层 sanityRules.checks[I5] 同源；只从 STORY 取数，启动期不碰 FUI（TDZ）。 */
  const cbUi=(STORY.mainline.clueScaffold.finale||{}).uiTexts||{};
  ['c2','c3','c4','c5'].forEach(id=>{
    const cc=CLUES.find(x=>x.id===id), hh=cc&&cc.interpret&&cc.interpret.hint;
    const lid=cc&&cc.interpret&&cc.interpret.channelB&&cc.interpret.channelB.loverId;
    if(!hh || typeof hh!=='object' || Object.keys(hh).length!==1 || !hh[lid])
      console.warn('[雾中车站·I5] 线索 '+id+' 的 hint 未按 loverId 索引或台词缺失。');
  });
  ['channelBWrong','channelBPickTitle','channelBPickHint','channelBResultRight','channelBResultWrong','channelBNone']
    .forEach(k=>{ if(!cbUi[k]) console.warn('[雾中车站·I5] uiTexts.'+k+' 缺失。'); });
}

function costAction(){
  if(S.actionsLeft<=0){
    /* 【2026-11-07 二周目报错句】一周目逐字沿用原区间报错，二周目读独立定稿句。
       两句都在 uiTexts.actionPool；字段缺失 / 占位时回退到原硬编码串，不露占位符。 */
    const ap=FUI.actionPool||{};
    const t=S.srPool
      ? pendingText(ap.exhaustedPool,'行动点用完了。')
      : pendingText(ap.exhaustedZone,'本区间的行动点已经用完了。去下一区间吧。');
    if(t) pushEvent(esc(t),[{t:'知道了',fn:()=>{}}]);
    flushEvents(); return false;
  }
  S.actionsLeft--; return true;
}
/* ---------- 【2026-11-06 · C1 教学：三步演示版分析】 ----------
   文案全在 clues[0].tutorial.steps：①祝颜递半句（与 trustPolicy.tiers[0].line 逐字同源，
   第 1 档必出）→ ②展示 interpret.text 整句 + 只列 3 个可点 token → ③逻辑桥收尾 + journalTag。
   与 c2–c6 完全隔离：本枚 via=['tutorial']，不渲染通道 A/B，也不走 actWriteKeyword。
   教学豁免：点错重来、不写 wrong、不扣行动点、不限次数；M2「写错不可逆」从 zone2 起生效。
   跳过 = auto_done（H3 原口径）：done + keyword=c1_b + via='tutorial'，不扣点、不写 wrong。
   教学 0 点；trust 仍由 zone1 教学白送 1（来源不变），只在 autoRecord 里加一次。 */
const TUT_SPEAKER_ALIAS={zhu_yan:'conductor_f'};   // steps[0].speaker 是显示别名，keyNpcs 里叫 conductor_f
let TUT_STEP=0;                                    // 模块内运行时态，不写进存档
function tutClue(){ return clueByZone(1); }
function tutData(c){ return (c&&c.tutorial)||{}; }
function tutStep(c,i){ return (tutData(c).steps||[])[i]||{}; }
function tutUi(c){ return tutData(c).ui||{}; }
function tutTag(c){ return pendingText(tutStep(c,2).journalTag,'教学：这一笔已替你记下'); }
function tutRich(s){ return nl2br(s||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function tutSpeaker(step){
  const raw=(step&&step.speaker)||'conductor_f';
  const n=KEY_BY[TUT_SPEAKER_ALIAS[raw]||raw];
  return n?n.name:'祝颜';
}
function tutToken(c,k){ return (c.tokens||[]).find(t=>t.key===k)||null; }
/* 跳过 / 兜底共用的「系统代写 done」：H3 原口径，不扣点、不写 wrong */
function autoDone(c){
  const q=clueOf(c.zone);
  q.found=true; q.state='done'; q.keyword=c.keyword.key;
  q.wrong=false; q.via='tutorial';
  addLog('教学：'+tutTag(c)+'（第 1 笔由系统代写，跳过也一样）。');
}
function closeTutorial(){
  eventQueue.length=0;
  const m=$('mask'); if(m&&m.classList) m.classList.remove('show');
}
/* 按 steps 逐屏播；每屏只往事件队列压 1 条，点完由 flushEvents() 接下一屏。 */
function runTutorial(c,step,notice){
  if(!c||!tutData(c).enabled) return;
  TUT_STEP=step;
  const u=tutUi(c), s=tutStep(c,step);
  /* 【文案整理 v1 · 3】三步各有自己的标题与提示行，全部读 tutorial.ui，
     缺字段 / 空串 → 回退原渲染（标题回退 u.title，提示行整行不渲染）。 */
  const headOf=k=>`<span class="nm">${esc(pendingText(u[k],pendingText(u.title,'教 学 · 第 1 笔')))}</span><br>`;
  const descOf=k=>{ const d=pendingText(u[k],''); return d?`<div class="desc">${esc(d)}</div>`:''; };
  const head=headOf('title');
  const skip={t:esc(pendingText(u.skipLabel,'跳过')),ghost:true,fn:()=>tutorialSkip(c)};
  if(s.type==='line'){
    pushEvent(head+descOf('step1Hint')
      +`<span class="nm">${esc(tutSpeaker(s))}</span><br>`+tutRich(s.text),
      [{t:esc(pendingText(u.nextLabel,'下一步')),fn:()=>runTutorial(c,1)},skip]);
    return;
  }
  if(s.type==='pickToken'){
    const note=notice?`<span class="desc">${esc(notice)}</span><br>`:'';
    const opts=(s.tokens||[]).map(k=>({
      t:'就是这句：'+esc(tokenText(tutToken(c,k)||{key:k,text:''})),
      fn:()=>tutorialPick(c,k)
    }));
    opts.push(skip);
    const sentence=s.showInterpretText===false?''
      :`<span class="nm">${esc(pendingText(u.sentenceLabel,'整句'))}</span><br>${tutRich(fullSentence(c))}<br>`;
    pushEvent(headOf('step2Title')+note+sentence+descOf('step2Hint'),opts);
    return;
  }
  /* done：收尾正文 + journalTag（补成 2.4 定稿的第三行「手账这一条标着：…」） */
  const jl=String(pendingText(u.journalLabel,'手账这一条标着：「{tag}」。')).replace('{tag}',tutTag(c));
  pushEvent(headOf('step3Title')+tutRich(s.text)+`<br><span class="desc">${esc(jl)}</span>`+descOf('step3Hint'),
    [{t:esc(pendingText(u.finishLabel,'完成')),fn:()=>closeTutorial()}]);
}
function tutorialPick(c,k){
  const q=clueOf(c.zone), s=tutStep(c,1);
  if(q.state==='done'){ runTutorial(c,2); return; }
  if(k===c.keyword.key){
    q.found=true; q.state='done'; q.keyword=k; q.wrong=false; q.via='tutorial';
    addLog('教学第 1 笔：圈出「'+tokenText(tutToken(c,k))+'」，写下 '+keywordLabel(c,k)+'。');
    runTutorial(c,2);                    // 点对 → 手账写入 keyword → 进第三步
  } else {
    /* onWrong:'retry' + wrongPenalty:false：不写 wrong、不扣点、不限次数，留在第二步 */
    const retry=(s.onWrong||'retry')==='retry' && s.wrongPenalty!==true;
    runTutorial(c,1, retry?pendingText(tutUi(c).retryText,'再想想。祝颜说的不是这个。'):'');
  }
}
function tutorialSkip(c){
  if(tutData(c).skipBehavior==='auto_done') autoDone(c);
  closeTutorial();
  afterChange();                       // 只改 S，画面由 S 重生成（外层回调再跑一次也幂等）
}
/* 教学唯一入口：zone1 自动播之外，主线页「进入教学」与四处 c1 门禁都落到这里。
   中途读档时 S.clue[1] 停在 pending，随时可续播（TUT_STEP 不持久化，从第一步重来）。 */
function tutorialEntry(){
  const c=tutClue(); if(!c) return;
  const q=clueOf(1);
  if(q.state==='done'){ return actReread(1); }
  if(!q.found){ q.found=true; q.state='pending'; q.via='tutorial'; }
  runTutorial(c,0);
  flushEvents();
}
/* 【2.7 / H3】autoRecord 只在 zone1 教学触发一次：
   旧版「一行字弹窗 + 直接 done」改为「pending + 三步演示版」。
   跳过直接 done，正常路径点对了才 done；两种方式都不扣行动点、都不写 wrong。 */
function autoRecord(zone){
  if(+zone!==1) return;
  const c=tutClue(); if(!c) return;
  const q=clueOf(1);
  if(q.state==='done') return;           // 老档已 done：不重播教学
  q.found=true; q.state='pending'; q.keyword=null;
  q.wrong=false; q.via='tutorial';
  addTrust(1);                          // 【甲】H3 教学白送，trust 数值起点 1（来源不变）
  addLog('记下第 1 笔：'+c.record+'（'+tutTag(c)+'）');
  runTutorial(c,0);
}

/* ══════════════════════════════════════════════════════════════════════════
   【2026-11-06 祝颜主页面入口 · 最终版】新增函数独立区块（硬撤回＝删这一整块）
   · 两个入口函数都受 CFG.conductorHomeCard.enabled 控制；旧代码只在 scene() 加一处调用、
     在事件委托加一个分支。
   · 卡片顺序：名字 / 位置 / 信任点 / 待解读数 / 说明小字 / 按钮（/ 二周目小字）。
   · 文案全部取自 STORY.mainline.clueScaffold.conductorHomeCard，引擎不硬编码台词。
   · actInterpret() 内部（耗点 / addTrust / state→pending）一行未动，这里只负责列线索。
   ══════════════════════════════════════════════════════════════════════════ */
function chcRawZones(){
  /* 卡片的「待解读数」与面板列表共用这一份，保证两处永远一致。
     排除 zone1：c1 是三步教学枚，教学弹窗是它唯一入口（actInterpret 也会拦）。
     S.clue 的键是 zone 字符串，Number 转回并排序。 */
  if(!S||!S.clue) return [];
  return Object.keys(S.clue).map(Number)
    .filter(z=>z!==1 && S.clue[z] && S.clue[z].found && S.clue[z].state==='raw')
    .sort((a,b)=>a-b);
}
/* 【角色头像 v1】纯显示，不参与任何判定。path 为空 → 只有底色 + 首字；
   有 path → 塞 <img>，加载失败时 onerror 把它摘掉，div 变空后由 CSS 补首字。 */
function avatarHtml(name, path){
  const fb=(name||'').slice(0,1);
  const img=path?`<img src="${esc(path)}" alt="" onerror="this.remove()">`:'';
  return `<div class="avatar" data-fb="${esc(fb)}">${img}</div>`;
}
function renderConductorCard(){
  const opt=CFG.conductorHomeCard;
  if(!opt||!opt.enabled) return '';
  const card=(STORY.mainline.clueScaffold||{}).conductorHomeCard;
  if(!card||!card.display) return '';   // 旧档无字段 → 空串、不报错，主页面回退旧摆设卡片
  const d=card.display, max=d.trustMax||5;
  const trust=S.trust||0;
  const filled=Math.max(0,Math.min(max,trust));  // 只防 String.repeat 负数抛错，不改数值
  const pending=chcRawZones().length;
  const fast=fastOn();
  /* 头像路径取自 keyNpcs，不写进 card.display（display 只放文案字段）。 */
  const av=(KEY_BY['conductor_f']||{}).avatar||'';
  let h=`<div class="chc-card" data-act="conductor-card">`;
  h+=`<div class="chc-head">${avatarHtml(d.name,av)}<div class="card-body">`;
  h+=`<div class="chc-name">${esc(d.name)}</div>`;
  h+=`<div class="chc-loc">${esc(d.location)}</div>`;
  h+=`<div class="chc-trust">${esc(d.trustLabel)}：${'●'.repeat(filled)}${'○'.repeat(max-filled)}</div>`;
  /* 【FAST · 2.3】二周目点热点直落 pending，chcRawZones() 只数 raw → 恒空，
     这一行只会渲染「待解读：没有需要解读的」，与「找她聊聊」自相矛盾，故整行不渲染。 */
  if(!fast) h+=`<div class="chc-pending">${esc(d.pendingLabel)}：${pending>0?pending+' 条':esc(card.emptyState)}</div>`;
  /* 说明小字：解释信任点是什么，不承诺功能。旧档缺字段时不渲染，避免 esc(undefined)。 */
  if(d.trustHint) h+=`<div class="chc-hint">${esc(d.trustHint)}</div>`;
  h+=`</div></div>`;
  h+=`<button class="chc-btn" type="button">${esc(fast?'找她聊聊':d.buttonLabel)}</button>`;
  if(fast) h+=`<div class="chc-hint">她好像只是想说说话。</div>`;
  if(card.secondRunHint && isGlimpseActive() && trust>=2)
    h+=`<div class="chc-secondrun">${esc(card.secondRunHint.text)}</div>`;
  return h+`</div>`;
}
function openConductorPanel(){
  const opt=CFG.conductorHomeCard;
  if(!opt||!opt.enabled) return;
  const card=(STORY.mainline.clueScaffold||{}).conductorHomeCard;
  if(!card||!card.display) return;
  /* 【2026-11-07 批 2】二周目找祝颜：先播未听过的高档台词（每档只一次），再开面板。
     一周目 / 二周目未达档位时 maybePlaySecondRunTier 直接 callback，行为不变。 */
  maybePlaySecondRunTier(()=>openConductorPanelInner(card));
}
function openConductorPanelInner(card){
  /* 【FAST · 2.4】二周目：只播一句剧情，不列待解读、不加 trust、不碰 AP、不置线索 flag。
     显式分支是为了防「旧档 / 开关中途切换」残留的 raw——那些 raw 若走 conductor_f，
     会 addTrust(1)，与 actWriteKeyword 的 fast +1 叠成双份 trust。
     高档台词由前面的 maybePlaySecondRunTier 负责（它只写 S.flags.srTier_N、不碰数值），这里不重复播。 */
  if(fastOn()){
    pushEvent(`<span class="nm">${esc(card.display.name)}</span><br>${esc(card.noPendingReply)}`);
    return flushEvents();
  }
  const zones=chcRawZones();
  if(!zones.length){
    /* 无待解读：不耗点、不加 trust，只播她一句话（pushEvent 默认给「知道了」按钮）。 */
    pushEvent(`<span class="nm">${esc(card.display.name)}</span><br>${esc(card.noPendingReply)}`);
    return flushEvents();
  }
  /* 真实签名是 pushEvent(text, opts[{t,fn}])，不是示例里的 {type:'choice'}；
     clueOf(z) 只是存档 slot（没有 record/zone），标题要用 clueByZone(z).record。
     fn 直接调现有 actInterpret(z,'conductor_f')，耗点 / trust / pending 完全复用。 */
  pushEvent(`<span class="nm">${esc(card.display.name)}</span><br>${esc(card.display.panelPrompt||'')}`,
    zones.map(z=>{
      const c=clueByZone(z);
      return {t:esc(c?c.record:''),fn:()=>actInterpret(z,'conductor_f')};
    }));
  flushEvents();
}
